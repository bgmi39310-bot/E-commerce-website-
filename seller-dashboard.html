<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #232f3e; margin-top: 0; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .full-width { grid-column: span 2; }
        
        button { background-color: #232f3e; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #37475a; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f2f2f2; }
        .delete-btn { color: #ff4d4d; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h2>Seller Hub</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="account.html">Account</a>
    </div>
</header>

<div class="container">
    <div class="card">
        <h2>Add New Product</h2>
        <div class="form-grid">
            <input type="text" id="pName" placeholder="Product Name">
            <input type="number" id="pPrice" placeholder="Price (₹)">
            <input type="text" id="pImage" placeholder="Image URL" class="full-width">
            <textarea id="pDesc" placeholder="Product Description" class="full-width" rows="3"></textarea>
            <button onclick="addProduct()" class="full-width">List Product</button>
        </div>
    </div>

    <div class="card">
        <h2>My Listed Products</h2>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="productTable">
                <!-- Data will appear here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        
        if (!name || !price) return alert("Fill in name and price!");
        
        const row = `<tr><td>${name}</td><td>₹${price}</td><td><span class="delete-btn" onclick="this.parentElement.parentElement.remove()">Delete</span></td></tr>`;
        document.getElementById('productTable').innerHTML += row;
        
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImage').value = '';
        document.getElementById('pDesc').value = '';
    }
</script>
</body>
</html>
