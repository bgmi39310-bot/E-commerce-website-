<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Item - DesiMarket</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #ffd814; border: 1px solid #fcd200; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }
        button:hover { background-color: #f7ca00; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="sell.html">Sell Item</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
            <a href="login.html">Login</a>
        </div>
    </header>

    <div class="container">
        <h2>List a New Product</h2>
        <form id="sellForm">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" required placeholder="Enter product name">
            </div>
            <div class="form-group">
                <label for="productPrice">Price (₹)</label>
                <input type="number" id="productPrice" required placeholder="Enter price">
            </div>
            <div class="form-group">
                <label for="productImage">Image URL</label>
                <input type="url" id="productImage" required placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label for="productDesc">Description</label>
                <textarea id="productDesc" rows="4" required placeholder="Describe your item"></textarea>
            </div>
            <button type="submit">Post Product</button>
        </form>
    </div>

    <script>
        document.getElementById('sellForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const image = document.getElementById('productImage').value;
            const desc = document.getElementById('productDesc').value;

            const newProduct = {
                name: name,
                price: price,
                image: image,
                desc: desc
            };

            // Get existing products or empty array
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products.push(newProduct);
            localStorage.setItem('products', JSON.stringify(products));

            alert('Product listed successfully!');
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
