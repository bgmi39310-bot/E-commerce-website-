<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - DesiMarket</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#232f3e">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="shared-ui.css">
    <script src="pwa-init.js" defer></script>
    <script src="click-guard.js" defer></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SKX86X8V6K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SKX86X8V6K');
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }

        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 998; }
        .back-arrow { font-size: 20px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: bold; }

        .container { max-width: 650px; margin: 20px auto; padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
        h2 { color: #232f3e; margin-top: 0; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; font-size: 13px; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 14.5px; }
        .form-row { display: flex; gap: 12px; }

        .saved-addr-card { border: 1.5px solid #ddd; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
        .saved-addr-card.selected { border-color: #fa8900; background: #fff8ee; }
        .saved-addr-card strong { font-size: 13.5px; }
        .saved-addr-card .default-tag { background: #d4edda; color: #1a7f4b; font-size: 10px; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
        .new-addr-link { font-size: 12.5px; color: #007185; cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 4px; }
        .form-row .form-group { flex: 1; }

        .payment-options { display: flex; gap: 10px; }
        .payment-card { flex: 1; border: 2px solid #ddd; border-radius: 6px; padding: 12px; text-align: center; cursor: pointer; font-size: 13.5px; font-weight: 600; }
        .payment-card.active { border-color: #fa8900; background: #fff3e0; color: #c7511f; }

        .order-item-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid #f2f2f2; }
        .order-item-row:last-of-type { border-bottom: none; }
        .grand-total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; padding-top: 10px; margin-top: 6px; border-top: 1px solid #eee; }
        .coupon-row { display: flex; gap: 8px; margin-top: 12px; }
        .coupon-row input { flex-grow: 1; }
        .btn-apply-coupon { background: #232f3e; color: white; border: none; padding: 0 18px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 13.5px; }
        .discount-row { display: flex; justify-content: space-between; font-size: 13.5px; color: #28a745; font-weight: 600; padding-top: 8px; }

        .btn-place { background-color: #fa8900; color: white; border: none; width: 100%; padding: 13px; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; margin-top: 10px; }
        .btn-place:hover { background-color: #e07b00; }
        .btn-place:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <header>
        <div class="back-arrow" onclick="history.back()">⬅️</div>
        <div class="header-title">Checkout</div>
        <div id="notifBellMount" style="margin-left:auto;"></div>
    </header>

    <div class="container">

        <div class="card">
            <h2>📦 Order Summary</h2>
            <div id="orderItemsList"></div>
            <div class="coupon-row">
                <input type="text" id="couponInput" placeholder="Have a coupon code?" style="text-transform:uppercase;">
                <button onclick="applyCouponCode()" class="btn-apply-coupon">Apply</button>
            </div>
            <div id="couponMsg" style="font-size:12.5px; margin-top:6px; display:none;"></div>
            <div class="discount-row" id="discountRow" style="display:none;">
                <span>Coupon Discount</span>
                <span id="discountAmount">-₹0</span>
            </div>
            <div class="grand-total-row">
                <span>Total Payable</span>
                <span id="grandTotal">₹0</span>
            </div>
        </div>

        <div class="card">
            <h2>🚚 Delivery Details</h2>
            <div id="savedAddressList" style="margin-bottom:14px;"></div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cName" placeholder="Enter your name">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="cPhone" placeholder="10-digit mobile number" maxlength="10">
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="cPincode" placeholder="e.g. 226001" maxlength="6">
                </div>
            </div>
            <div class="form-group">
                <label>Complete Address (House No, Street, Landmark)</label>
                <textarea id="cAddress" rows="2" placeholder="Enter complete address"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>City / Village</label>
                    <input type="text" id="cCity" placeholder="City">
                </div>
                <div class="form-group">
                    <label>State</label>
                    <input type="text" id="cState" placeholder="State">
                </div>
            </div>
        </div>

        <div class="card">
            <h2>💳 Payment Method</h2>
            <div class="payment-options">
                <div class="payment-card active" data-method="COD" onclick="selectPayment('COD')">💵 Cash on Delivery</div>
                <div class="payment-card" data-method="UPI" onclick="selectPayment('UPI')">📱 Pay via UPI Now</div>
                <div class="payment-card" data-method="RAZORPAY" onclick="selectPayment('RAZORPAY')">💳 Pay Online (Card / UPI / Netbanking)</div>
            </div>
            <div id="upiPayBox" style="display:none; margin-top:14px; text-align:center;">
                <button type="button" id="upiPayBtn" style="background:#232f3e; color:white; border:none; padding:11px 20px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13.5px;">📲 Open UPI App to Pay</button>
                <p id="upiPayNote" style="font-size:11.5px; color:#767676; margin-top:8px;"></p>
            </div>
        </div>

        <button class="btn-place" id="placeOrderBtn">Place Order</button>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, addDoc, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { validateCoupon } from './coupon-logic.js';
        import { decrementStockForCart } from './stock-logic.js';
        import { loadAddresses } from './address-logic.js';
        import { showToast } from './toast.js';
        import { escapeHtml } from './sanitize.js';
        import { mountNotificationBell, sendNotification } from './notif-logic.js';

        let currentBuyerUid = null;
        let currentBuyerUser = null;
        onAuthStateChanged(auth, (user) => {
            currentBuyerUid = user ? user.uid : null;
            currentBuyerUser = user;
            if (currentBuyerUid) {
                loadSavedAddresses();
                mountNotificationBell(db, currentBuyerUid, 'notifBellMount');
            }
        });

        async function loadSavedAddresses() {
            const listEl = document.getElementById('savedAddressList');
            const addresses = await loadAddresses(db, currentBuyerUid);

            if (addresses.length === 0) {
                listEl.innerHTML = '';
                return;
            }

            listEl.innerHTML = addresses.map((a, i) => `
                <div class="saved-addr-card ${i === 0 ? 'selected' : ''}" onclick='selectSavedAddress(${JSON.stringify(a).replace(/'/g, "&#39;")}, this)'>
                    <strong>${escapeHtml(a.label || 'Address')}</strong> ${a.isDefault ? '<span class="default-tag">DEFAULT</span>' : ''}<br>
                    ${escapeHtml(a.name)}, ${escapeHtml(a.phone)}<br>
                    ${escapeHtml(a.addressLine)}, ${escapeHtml(a.city)}, ${escapeHtml(a.state)} ${a.pincode ? '- ' + escapeHtml(a.pincode) : ''}
                </div>
            `).join('') + `<div class="new-addr-link" onclick="clearAddressSelection()">+ Enter a different address</div>`;

            // Auto-fill using the default (or first) saved address
            selectSavedAddress(addresses[0], listEl.querySelector('.saved-addr-card'));
        }

        window.selectSavedAddress = function(addr, cardEl) {
            document.querySelectorAll('.saved-addr-card').forEach(c => c.classList.remove('selected'));
            if (cardEl) cardEl.classList.add('selected');

            document.getElementById('cName').value = addr.name || '';
            document.getElementById('cPhone').value = addr.phone || '';
            document.getElementById('cPincode').value = addr.pincode || '';
            document.getElementById('cAddress').value = addr.addressLine || '';
            document.getElementById('cCity').value = addr.city || '';
            document.getElementById('cState').value = addr.state || '';
        };

        window.clearAddressSelection = function() {
            document.querySelectorAll('.saved-addr-card').forEach(c => c.classList.remove('selected'));
            ['cName', 'cPhone', 'cPincode', 'cAddress', 'cCity', 'cState'].forEach(id => document.getElementById(id).value = '');
        };

        let selectedPayment = 'COD';
        window.selectPayment = async function(method) {
            selectedPayment = method;
            document.querySelectorAll('.payment-card').forEach(c => c.classList.toggle('active', c.dataset.method === method));

            const upiBox = document.getElementById('upiPayBox');
            if (method === 'UPI') {
                await setupUpiPayment();
                upiBox.style.display = 'block';
            } else {
                upiBox.style.display = 'none';
            }
        };

        async function setupUpiPayment() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const noteEl = document.getElementById('upiPayNote');
            const btn = document.getElementById('upiPayBtn');

            const sellerUids = [...new Set(cart.map(item => item.sellerUid).filter(Boolean))];
            if (sellerUids.length === 0) {
                noteEl.innerText = 'UPI payment unavailable for this order.';
                btn.style.display = 'none';
                return;
            }
            if (sellerUids.length > 1) {
                noteEl.innerText = 'Your cart has items from multiple sellers — please pay via Cash on Delivery, or checkout each seller separately for UPI.';
                btn.style.display = 'none';
                return;
            }

            const sellerSnap = await getDoc(doc(db, "sellers_profiles", sellerUids[0]));
            const sellerData = sellerSnap.exists() ? sellerSnap.data() : {};

            if (!sellerData.upiId) {
                noteEl.innerText = 'This seller has not added a UPI ID yet — please use Cash on Delivery.';
                btn.style.display = 'none';
                return;
            }

            const { finalTotal } = renderSummary();
            const upiUrl = `upi://pay?pa=${encodeURIComponent(sellerData.upiId)}&pn=${encodeURIComponent(sellerData.shopName || 'DesiMarket Seller')}&am=${finalTotal.toFixed(2)}&cu=INR&tn=${encodeURIComponent('DesiMarket Order')}`;

            btn.style.display = 'inline-block';
            noteEl.innerText = `Pay ₹${finalTotal.toFixed(0)} to ${sellerData.shopName || 'seller'} via your UPI app, then place the order.`;
            btn.onclick = () => { window.location.href = upiUrl; };
        }

        let appliedCoupon = null; // { id, code, sellerUid, discountType, value }

        function computeDiscount(cart, subtotal) {
            if (!appliedCoupon) return 0;
            // Coupon only discounts items belonging to that specific seller
            const eligibleSubtotal = cart
                .filter(item => item.sellerUid === appliedCoupon.sellerUid)
                .reduce((sum, item) => sum + (parseInt(item.qty) || 1) * (parseFloat(item.price) || 0), 0);

            if (eligibleSubtotal === 0) return 0;

            if (appliedCoupon.discountType === 'percent') {
                return Math.min(eligibleSubtotal * (appliedCoupon.value / 100), eligibleSubtotal);
            }
            return Math.min(appliedCoupon.value, eligibleSubtotal);
        }

        window.applyCouponCode = async function() {
            const code = document.getElementById('couponInput').value;
            const msgEl = document.getElementById('couponMsg');
            if (!code.trim()) return;

            const coupon = await validateCoupon(db, code);
            if (!coupon) {
                appliedCoupon = null;
                msgEl.style.display = 'block';
                msgEl.style.color = '#dc3545';
                msgEl.innerText = '❌ Invalid or expired coupon code.';
                renderSummary();
                return;
            }

            appliedCoupon = coupon;
            msgEl.style.display = 'block';
            msgEl.style.color = '#28a745';
            msgEl.innerText = `✅ Coupon "${coupon.code}" applied!`;
            renderSummary();
        };

        function renderSummary() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const listEl = document.getElementById('orderItemsList');
            let total = 0;
            listEl.innerHTML = '';

            cart.forEach(item => {
                const qty = parseInt(item.qty) || 1;
                const price = parseFloat(item.price) || 0;
                const lineTotal = qty * price;
                total += lineTotal;
                listEl.innerHTML += `<div class="order-item-row"><span>${escapeHtml(item.name)} × ${qty}</span><span>₹${lineTotal.toFixed(0)}</span></div>`;
            });

            const discount = computeDiscount(cart, total);
            const discountRow = document.getElementById('discountRow');
            if (discount > 0) {
                discountRow.style.display = 'flex';
                document.getElementById('discountAmount').innerText = '-₹' + discount.toFixed(0);
            } else {
                discountRow.style.display = 'none';
            }

            const finalTotal = total - discount;
            document.getElementById('grandTotal').innerText = '₹' + finalTotal.toFixed(0);
            return { cart, total, discount, finalTotal };
        }

        function prefillFromProfile() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user) {
                document.getElementById('cName').value = (user.name || '') + (user.surname ? ' ' + user.surname : '');
                document.getElementById('cPhone').value = user.phone || '';
                document.getElementById('cCity').value = user.city || '';
                document.getElementById('cState').value = user.state || '';
            }
        }

        window.placeOrder = async function() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                showToast('Your cart is empty!');
                window.location.href = 'index.html';
                return;
            }

            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const pincode = document.getElementById('cPincode').value.trim();
            const address = document.getElementById('cAddress').value.trim();
            const city = document.getElementById('cCity').value.trim();
            const state = document.getElementById('cState').value.trim();

            if (!name || !phone || !address || !city) {
                showToast('Please fill in all delivery details!', 'error');
                return;
            }
            if (!/^\d{10}$/.test(phone)) {
                showToast('Please enter a valid 10-digit mobile number.', 'error');
                return;
            }

            const btn = document.getElementById('placeOrderBtn');
            btn.disabled = true;
            btn.innerText = 'Placing order...';

            const fullAddress = `${address}, ${city}, ${state}${pincode ? ' - ' + pincode : ''}`;

            if (selectedPayment === 'RAZORPAY') {
                await placeOrderViaRazorpay({ name, phone, address: fullAddress, btn });
                return;
            }

            try {
                // Reserve stock first — if any item is out of stock or short, this
                // throws and we stop before creating any orders (no half-placed orders).
                await decrementStockForCart(db, cart);

                const eligibleSubtotal = appliedCoupon
                    ? cart.filter(item => item.sellerUid === appliedCoupon.sellerUid)
                          .reduce((sum, item) => sum + (parseInt(item.qty) || 1) * (parseFloat(item.price) || 0), 0)
                    : 0;
                const totalDiscount = appliedCoupon ? computeDiscount(cart, 0) : 0;

                // Each cart item becomes its own order, carrying its own sellerUid,
                // so it reaches the correct seller's dashboard.
                for (let item of cart) {
                    const qty = parseInt(item.qty) || 1;
                    const price = parseFloat(item.price) || 0;
                    let lineTotal = price * qty;

                    // If this item belongs to the coupon's seller, apply its share of the discount
                    if (appliedCoupon && item.sellerUid === appliedCoupon.sellerUid && eligibleSubtotal > 0) {
                        const shareOfDiscount = (lineTotal / eligibleSubtotal) * totalDiscount;
                        lineTotal = Math.max(0, lineTotal - shareOfDiscount);
                    }

                    await addDoc(collection(db, "orders"), {
                        productId: item.id || null,
                        productName: item.name,
                        selectedSize: item.selectedSize || null,
                        selectedColor: item.selectedColor || null,
                        price: lineTotal,
                        quantity: qty,
                        shopName: item.shopName || 'Local Shop',
                        sellerUid: item.sellerUid || null,
                        returnWindowDays: item.returnWindowDays !== undefined ? item.returnWindowDays : 7,
                        buyerUid: currentBuyerUid,
                        buyerName: name,
                        buyerPhone: phone,
                        buyerAddress: fullAddress,
                        paymentMethod: selectedPayment,
                        couponCode: (appliedCoupon && item.sellerUid === appliedCoupon.sellerUid) ? appliedCoupon.code : null,
                        status: 'Pending',
                        createdAt: new Date()
                    });

                    if (item.sellerUid) {
                        sendNotification(db, item.sellerUid, {
                            title: `New order: ${item.name || 'Item'} (Qty ${qty})`,
                            body: `From ${name} — ₹${lineTotal.toFixed(0)}`,
                            type: 'new_order',
                            link: 'seller-dashboard.html'
                        });
                    }

                    // Reduce stock for the purchased quantity so it stays accurate live
                    if (item.id) {
                        try {
                            await updateDoc(doc(db, "vendors", item.id), { stock: increment(-qty) });
                        } catch (stockErr) {
                            console.error('Stock update failed for', item.id, stockErr);
                        }
                    }
                }

                // Keep a local copy for the buyer's "My Orders" quick view
                let myOrders = JSON.parse(localStorage.getItem('myOrders')) || [];
                cart.forEach(item => {
                    const qty = parseInt(item.qty) || 1;
                    const price = parseFloat(item.price) || 0;
                    myOrders.unshift({
                        id: 'ORD' + Math.floor(100000 + Math.random() * 900000),
                        name: item.name,
                        price: price * qty,
                        date: new Date().toLocaleDateString(),
                        status: 'Pending'
                    });
                });
                localStorage.setItem('myOrders', JSON.stringify(myOrders));
                localStorage.removeItem('cart');

                showToast('Order placed successfully! The seller has been notified. 🎉');
                window.location.href = 'orders.html';
            } catch (error) {
                console.error('Order error:', error);
                showToast('Error placing order: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerText = 'Place Order';
            }
        };

        document.getElementById('placeOrderBtn').addEventListener('click', window.placeOrder);

        // ====================================================================
        // Backend URL for the Flask API (payments/admin/cron) — see
        // render.yaml. Update this if you ever rename the vande-market-api
        // service (its URL changes with the name) or move to a custom domain.
        // ====================================================================
        const BACKEND_BASE_URL = 'https://vande-market-api.onrender.com';

        async function placeOrderViaRazorpay({ name, phone, address, btn }) {
            try {
                await decrementStockForCart(db, cart);

                const eligibleSubtotal = appliedCoupon
                    ? cart.filter(item => item.sellerUid === appliedCoupon.sellerUid)
                          .reduce((sum, item) => sum + (parseInt(item.qty) || 1) * (parseFloat(item.price) || 0), 0)
                    : 0;
                const totalDiscount = appliedCoupon ? computeDiscount(cart, 0) : 0;

                const items = cart.map(item => {
                    const qty = parseInt(item.qty) || 1;
                    const price = parseFloat(item.price) || 0;
                    let lineTotal = price * qty;
                    if (appliedCoupon && item.sellerUid === appliedCoupon.sellerUid && eligibleSubtotal > 0) {
                        const shareOfDiscount = (lineTotal / eligibleSubtotal) * totalDiscount;
                        lineTotal = Math.max(0, lineTotal - shareOfDiscount);
                    }
                    return {
                        productId: item.id || null,
                        productName: item.name,
                        shopName: item.shopName || 'Local Shop',
                        sellerUid: item.sellerUid || null,
                        returnWindowDays: item.returnWindowDays !== undefined ? item.returnWindowDays : 7,
                        selectedSize: item.selectedSize || null,
                        selectedColor: item.selectedColor || null,
                        price: lineTotal,
                        quantity: qty
                    };
                });
                const grandTotal = items.reduce((sum, i) => sum + i.price, 0);

                const idToken = await currentBuyerUser.getIdToken();

                const createRes = await fetch(`${BACKEND_BASE_URL}/api/payments/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                    body: JSON.stringify({ amount: grandTotal })
                });
                if (!createRes.ok) throw new Error((await createRes.json()).error || 'Could not start payment.');
                const { razorpayOrderId, amount, currency, keyId } = await createRes.json();

                const rzp = new Razorpay({
                    key: keyId,
                    order_id: razorpayOrderId,
                    amount, currency,
                    name: 'DesiMarket',
                    description: `${items.length} item${items.length === 1 ? '' : 's'}`,
                    prefill: { name, contact: phone },
                    theme: { color: '#232f3e' },
                    handler: async function(response) {
                        try {
                            const verifyRes = await fetch(`${BACKEND_BASE_URL}/api/payments/verify-and-place-order`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    items,
                                    delivery: { name, phone, address }
                                })
                            });
                            if (!verifyRes.ok) throw new Error((await verifyRes.json()).error || 'Payment verification failed.');

                            localStorage.removeItem('cart');
                            showToast('Payment successful! Order placed. 🎉');
                            window.location.href = 'orders.html';
                        } catch (verifyErr) {
                            console.error(verifyErr);
                            showToast('Payment received but order placement failed: ' + verifyErr.message + '. Please contact support with your payment ID: ' + response.razorpay_payment_id, 'error');
                            btn.disabled = false;
                            btn.innerText = 'Place Order';
                        }
                    },
                    modal: {
                        ondismiss: function() {
                            showToast('Payment cancelled.', 'error');
                            btn.disabled = false;
                            btn.innerText = 'Place Order';
                        }
                    }
                });
                rzp.on('payment.failed', function(response) {
                    showToast('Payment failed: ' + (response.error?.description || 'Please try again.'), 'error');
                    btn.disabled = false;
                    btn.innerText = 'Place Order';
                });
                rzp.open();
            } catch (error) {
                console.error('Razorpay checkout error:', error);
                showToast('Error starting payment: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerText = 'Place Order';
            }
        }

        window.onload = function() {
            renderSummary();
            prefillFromProfile();
        };
    </script>
</body>
</html>
