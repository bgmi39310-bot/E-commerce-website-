services:
  # ---------------- Frontend: the static site itself ----------------
  - type: web
    name: vande-market
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=(), usb=(), interest-cohort=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com https://checkout.razorpay.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://vande-market-api.onrender.com https://api.razorpay.com https://lumberjack.razorpay.com https://images.weserv.nl https://www.google-analytics.com https://www.googletagmanager.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org; frame-src https://checkout.razorpay.com https://api.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800, immutable
      - path: /*.json
        name: Cache-Control
        value: public, max-age=3600

  # ---------------- Backend: Flask API (payments/admin/cron) ----------------
  - type: web
    name: vande-market-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false      # paste the full service-account JSON in the Render dashboard — never in this file
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://vande-market.onrender.com,https://bgmi39310-bot.github.io"

  # ---------------- Scheduled housekeeping jobs ----------------
  - type: cron
    name: vande-market-cleanup-anonymous
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 3 * * 0"   # every Sunday at 3:00 AM UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron_runner.py cleanup"
    envVars:
      - key: BACKEND_BASE_URL
        value: "https://vande-market-api.onrender.com"
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: vande-market-return-reminders
    runtime: python
    plan: free
    rootDir: backend
    schedule: "0 9 * * *"   # every day at 9:00 AM UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron_runner.py reminders"
    envVars:
      - key: BACKEND_BASE_URL
        value: "https://vande-market-api.onrender.com"
      - key: CRON_SECRET
        sync: false

# ============================================================================
# Notes:
#
# - The frontend (vande-market) is a plain multi-page static site — real
#   .html files per page, no bundler — so buildCommand is empty and
#   staticPublishPath is "." (repo root). No SPA rewrite-to-index.html rule
#   is used on purpose; that pattern is for single-page apps only and would
#   be wrong here.
#
# - The backend (vande-market-api) and both cron jobs live in the backend/
#   folder (rootDir: backend), so Render only installs/runs what's needed
#   for each — the static frontend build doesn't touch Python at all.
#
# - Every `sync: false` env var must be filled in manually from the Render
#   Dashboard -> that service -> Environment. They're marked sync: false so
#   real secrets are never written into this file / committed to git.
#
# - Update ALLOWED_ORIGINS and the two BACKEND_BASE_URL values above if you
#   ever rename the vande-market-api service (its URL changes with the name).
# ============================================================================

# ----------------------------------------------------------------------------
# A note on the Content-Security-Policy above:
#
# It includes 'unsafe-inline' for scripts and styles. This is a real, known
# limitation, not an oversight: every page here uses inline
# <script type="module"> blocks and inline onclick="..." attributes for its
# actual logic (there's no build step to generate per-request nonces on a
# static site). A stricter CSP without 'unsafe-inline' would break every
# page immediately. Removing it properly would mean moving all page logic
# into external .js files and converting every onclick handler to
# addEventListener -- a large refactor, not a config change. The CSP above
# still meaningfully restricts which THIRD-PARTY origins can load scripts,
# connect out, or frame the site, which is real protection even with that
# limitation.
#
# Also: img-src is deliberately permissive (any https: origin) because
# sellers can paste arbitrary image URLs from anywhere, not just ImgBB.
#
# After deploying, check the browser console on each page type (product,
# checkout, admin, etc.) for "Refused to..." CSP violation messages, in
# case some third-party domain was missed above.
# ----------------------------------------------------------------------------
