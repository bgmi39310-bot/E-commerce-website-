<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        /* Header & Menu Icon Styling */
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        /* Side Menu Drawer */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #232f3e; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .side-menu a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: white; display: block; transition: 0.2s; }
        .side-menu a:hover { background-color: #37475a; }
        .side-menu .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; margin-left: 50px; }

        .container { max-width: 600px; margin: 30px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; margin-top: 0; text-align: center; }

        .profile-header { text-align: center; margin-bottom: 25px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #232f3e; margin-bottom: 10px; background-color: #eee; }
        .profile-name { font-size: 20px; font-weight: bold; color: #333; }
        
        .info-card { background: #fdfdfd; border: 1px solid #eee; border-radius: 6px; padding: 15px; margin-bottom: 15px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f2f2f2; font-size: 15px; }
        .info-row:last-child { border-bottom: none; }
        .label { font-weight: bold; color: #555; }
        .value { color: #333; }

        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 15px; text-align: center; text-decoration: none; display: inline-block; }
        .btn-edit { background-color: #ffd814; color: #111; border: 1px solid #fcd200; }
        .btn-edit:hover { background-color: #f7ca00; }
        .btn-logout { background-color: #ff4d4d; color: white; }
        .btn-logout:hover { background-color: #e04343; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <!-- 3-Lines (Hamburger) Icon -->
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Side Slide Menu -->
    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Home</a>
        <a href="seller-dashboard.html">🛒 Seller Hub</a>
        <a href="cart.html">🛍️ Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="account.html">👤 Account</a>
        <a href="checklist.html">🚀 Launch Checklist</a>
    </div>

    <div class="container">
        <h2>My Account Details</h2>
        
        <div class="profile-header">
            <img id="accPhoto" class="profile-img" src="" alt="Profile Photo">
            <div class="profile-name" id="accFullName">User Name</div>
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="label">Email:</span>
                <span class="value" id="accEmail">N/A</span>
            </div>
            <div class="info-row">
                <span class="label">Phone Number:</span>
                <span class="value" id="accPhone">N/A</span>
            </div>
            <div class="info-row">
                <span class="label">State (Pradesh):</span>
                <span class="value" id="accState">N/A</span>
            </div>
            <div class="info-row">
                <span class="label">District (Zila):</span>
                <span class="value" id="accDistrict">N/A</span>
            </div>
            <div class="info-row">
                <span class="label">City / Village:</span>
                <span class="value" id="accCity">N/A</span>
            </div>
        </div>

        <div class="btn-container">
            <a href="setup-profile.html" class="btn-action btn-edit">Edit Profile</a>
            <button class="btn-action btn-logout" onclick="logoutUser()">Log Out</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            if (menu.style.width === '250px') {
                menu.style.width = '0';
            } else {
                menu.style.width = '250px';
            }
        }

        window.onload = function() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (user) {
                if (user.name || user.surname) {
                    document.getElementById('accFullName').innerText = (user.name || '') + ' ' + (user.surname || '');
                }
                if (user.email) document.getElementById('accEmail').innerText = user.email;
                if (user.phone) document.getElementById('accPhone').innerText = user.phone;
                if (user.state) document.getElementById('accState').innerText = user.state;
                if (user.district) document.getElementById('accDistrict').innerText = user.district;
                if (user.city) document.getElementById('accCity').innerText = user.city;
                if (user.photo) {
                    document.getElementById('accPhoto').src = user.photo;
                } else {
                    document.getElementById('accPhoto').src = 'https://via.placeholder.com/100?text=No+Photo';
                }
            } else {
                document.getElementById('accFullName').innerText = "Guest User";
            }
        };

        function logoutUser() {
            localStorage.removeItem('currentUser');
            alert("Logged out successfully!");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
