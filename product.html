<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - DesiMarket</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f2f2f2; margin: 0; color: #0f1111; }

    header { background: #232f3e; padding: 14px 18px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
    .back-arrow { color: white; font-size: 20px; cursor: pointer; text-decoration: none; }
    .logo-area { color: white; font-size: 19px; font-weight: bold; text-decoration: none; flex-grow: 1; }
    .logo-area span { color: #ff9900; }
    .header-cart { color: white; font-size: 19px; text-decoration: none; position: relative; }
    .cart-badge { position: absolute; top: -7px; right: -10px; background: #ff9900; color: white; font-size: 10px; font-weight: bold; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }

    .container { max-width: 950px; margin: 0 auto; padding: 15px; }
    .product-layout { display: flex; gap: 22px; flex-wrap: wrap; }

    .gallery { flex: 1 1 320px; background: white; border-radius: 8px; padding: 15px; text-align: center; }
    .gallery img.main-img { width: 100%; max-width: 400px; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
    .thumb-strip { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .thumb-strip img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; }
    .thumb-strip img.active { border-color: #fa8900; opacity: 1; }

    /* Reviews */
    .reviews-card { background: white; border-radius: 8px; padding: 18px; margin-top: 20px; }
    .reviews-card h3 { font-size: 16px; margin-bottom: 10px; }
    .review-item { border-top: 1px solid #f0f0f0; padding: 12px 0; }
    .review-item:first-child { border-top: none; }
    .review-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .review-stars { color: #ff9900; font-size: 14px; }
    .review-author { font-size: 13px; color: #565959; font-weight: 600; }
    .review-comment { font-size: 13.5px; color: #333; line-height: 1.5; margin: 0; }

    .info-panel { flex: 1.3 1 380px; background: white; border-radius: 8px; padding: 20px; }
    .p-name { font-size: 21px; font-weight: 600; margin: 0 0 8px; }
    .p-shop { font-size: 13px; color: #565959; margin-bottom: 12px; display:flex; align-items:center; gap:6px; }
    .p-shop i { color: #007185; }
    .p-price { font-size: 26px; font-weight: bold; color: #B12704; margin-bottom: 4px; }
    .p-price small { font-size: 13px; color: #565959; font-weight: normal; }
    .p-badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
    .badge { font-size: 11.5px; background: #eafaf1; color: #1a7f4b; padding: 4px 10px; border-radius: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .badge.warranty { background: #eef3ff; color: #1a4d9f; }

    .desc-block { font-size: 14px; line-height: 1.7; color: #333; margin-bottom: 16px; }
    .spec-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 18px; }
    .spec-table td { padding: 6px 4px; border-bottom: 1px solid #f0f0f0; }
    .spec-table td:first-child { color: #565959; width: 40%; }

    .qty-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .qty-row label { font-size: 14px; font-weight: bold; }
    .qty-stepper { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 6px; overflow: hidden; }
    .qty-stepper button { background: #f0f2f2; border: none; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
    .qty-stepper span { width: 40px; text-align: center; font-weight: bold; }

    .action-row { display: flex; gap: 10px; }
    .btn-cart, .btn-buy { flex: 1; padding: 13px; border-radius: 6px; font-weight: bold; font-size: 14.5px; cursor: pointer; border: none; }
    .btn-cart { background: #ffd814; border: 1px solid #fcd200; }
    .btn-cart:hover { background: #f7ca00; }
    .btn-buy { background: #fa8900; color: white; }
    .btn-buy:hover { background: #e07b00; }

    /* Seller Card */
    .seller-card { background: white; border-radius: 8px; padding: 18px; margin-top: 20px; display: flex; gap: 15px; align-items: center; }
    .seller-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #eee; }
    .seller-info { flex-grow: 1; }
    .seller-info h4 { margin: 0 0 3px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .verified-tick { color: #1a7f4b; font-size: 13px; }
    .seller-info p { margin: 2px 0; font-size: 12.5px; color: #565959; }

    .loading-state, .error-state { text-align: center; padding: 60px 20px; background: white; border-radius: 8px; color: #666; }

    /* Buy Now Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: white; width: 100%; max-width: 480px; border-radius: 14px 14px 0 0; padding: 20px 20px 25px; max-height: 88vh; overflow-y: auto; }
    @media(min-width: 600px) { .modal-overlay { align-items: center; } .modal-box { border-radius: 12px; } }
    .modal-box h3 { margin: 0 0 4px; font-size: 18px; }
    .modal-box .modal-sub { font-size: 12.5px; color: #767676; margin-bottom: 16px; }
    .modal-close { float: right; font-size: 22px; cursor: pointer; color: #767676; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .order-summary { background: #f8f9fa; border-radius: 6px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 14px; display: flex; justify-content: space-between; }
    .btn-submit-order { width: 100%; background: #fa8900; color: white; border: none; padding: 13px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 6px; }
    .btn-submit-order:disabled { opacity: 0.6; }
</style>
</head>
<body>

<header>
    <a href="javascript:history.back()" class="back-arrow">⬅️</a>
    <a href="index.html" class="logo-area">Desi<span>Market</span></a>
    <a href="cart.html" class="header-cart"><i class="fas fa-shopping-cart">🛒</i><span class="cart-badge" id="cartBadge" style="display:none;">0</span></a>
</header>

<div class="container" id="pageContent">
    <div class="loading-state">Loading product details...</div>
</div>

<div class="container" style="padding-top:0;">
    <div class="reviews-card">
        <h3>⭐ Customer Reviews</h3>
        <div id="reviewsSummary" style="margin-bottom:14px;"></div>
        <div id="reviewsContainer"></div>
    </div>
</div>

<!-- Buy Now Modal -->
<div class="modal-overlay" id="buyModal">
    <div class="modal-box">
        <span class="modal-close" onclick="closeBuyModal()">&times;</span>
        <h3>Delivery Details</h3>
        <p class="modal-sub">Tell us where to deliver your order</p>

        <div class="order-summary" id="orderSummary"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="buyName" placeholder="Your name">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="buyPhone" placeholder="10-digit number" maxlength="10">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="buyPincode" placeholder="e.g. 226001" maxlength="6">
            </div>
        </div>
        <div class="form-group">
            <label>Complete Address (House No, Street, Landmark)</label>
            <textarea id="buyAddress" rows="2" placeholder="Enter full delivery address"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>City / Village</label>
                <input type="text" id="buyCity" placeholder="City">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" id="buyState" placeholder="State">
            </div>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="buyPayment">
                <option value="COD">Cash on Delivery</option>
                <option value="UPI">UPI (Pay to seller on delivery)</option>
            </select>
        </div>

        <button class="btn-submit-order" id="submitOrderBtn">Place Order</button>
    </div>
</div>

<script type="module">
    import { db, auth } from './firebase-config.js';
    import { doc, getDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { loadProductReviews } from './review-logic.js';

    let currentBuyerUid = null;
    onAuthStateChanged(auth, (user) => { currentBuyerUid = user ? user.uid : null; });

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    let currentProduct = null;
    let currentQty = 1;

    function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const badge = document.getElementById('cartBadge');
        const count = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 1), 0);
        if (count > 0) { badge.style.display = 'flex'; badge.innerText = count > 99 ? '99+' : count; }
        else { badge.style.display = 'none'; }
    }

    async function loadProduct() {
        const content = document.getElementById('pageContent');
        if (!productId) {
            content.innerHTML = `<div class="error-state">Product not found. <a href="index.html">Go back to homepage</a></div>`;
            return;
        }
        try {
            const snap = await getDoc(doc(db, "vendors", productId));
            if (!snap.exists()) {
                content.innerHTML = `<div class="error-state">This product is no longer available. <a href="index.html">Browse other products</a></div>`;
                return;
            }
            currentProduct = { id: snap.id, ...snap.data() };
            renderProduct(currentProduct);
            loadSellerInfo(currentProduct.sellerUid);
        } catch (error) {
            console.error(error);
            content.innerHTML = `<div class="error-state">Unable to load product. Please try again.</div>`;
        }
    }

    function renderProduct(p) {
        const content = document.getElementById('pageContent');
        const price = parseFloat(p.price) || 0;
        const image = p.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';
        const imageList = (Array.isArray(p.images) && p.images.length > 0) ? p.images : [image];
        const stock = p.stock !== undefined ? p.stock : 10;
        const outOfStock = stock <= 0;

        content.innerHTML = `
            <div class="product-layout">
                <div class="gallery">
                    <img class="main-img" id="mainProductImg" src="${imageList[0]}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">
                    ${imageList.length > 1 ? `
                        <div class="thumb-strip">
                            ${imageList.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}" onclick="switchMainImage('${img.replace(/'/g, "\\'")}', this)" onerror="this.style.display='none'">`).join('')}
                        </div>
                    ` : ''}
                </div>
                <div class="info-panel">
                    <h1 class="p-name">${p.name || 'Product'}</h1>
                    <div class="p-shop"><i class="fas fa-store">🏪</i> Sold by <strong>${p.shopName || 'Local Seller'}</strong></div>
                    <div class="p-price">₹${price.toFixed(0)} <small>${p.unit || ''}</small></div>

                    <div class="p-badges">
                        <span class="badge">✅ ${p.material || 'Original Quality'}</span>
                        <span class="badge warranty">🛡️ ${p.warranty || 'Verified Quality'}</span>
                        ${outOfStock ? '<span class="badge" style="background:#fdecea;color:#c0392b;">❌ Out of Stock</span>' : `<span class="badge" style="background:#eafaf1;color:#1a7f4b;">✔️ ${stock} in stock</span>`}
                    </div>

                    <div class="desc-block">${p.description || 'No additional description provided by the seller.'}</div>

                    <table class="spec-table">
                        <tr><td>Unit</td><td>${p.unit || 'Per Piece'}</td></tr>
                        <tr><td>Material / Type</td><td>${p.material || 'N/A'}</td></tr>
                        <tr><td>Warranty / Validity</td><td>${p.warranty || 'N/A'}</td></tr>
                    </table>

                    ${outOfStock ? `
                        <div style="background:#fdecea; color:#c0392b; padding:12px; border-radius:8px; text-align:center; font-weight:600; margin-bottom:14px;">
                            This product is currently out of stock.
                        </div>
                    ` : `
                        <div class="qty-row">
                            <label>Quantity:</label>
                            <div class="qty-stepper">
                                <button onclick="changeQty(-1)">−</button>
                                <span id="qtyDisplay">1</span>
                                <button onclick="changeQty(1)">+</button>
                            </div>
                        </div>

                        <div class="action-row">
                            <button class="btn-cart" onclick="addToCart()">🛒 Add to Cart</button>
                            <button class="btn-buy" onclick="openBuyModal()">⚡ Buy Now</button>
                        </div>
                    `}
                </div>
            </div>
            <div class="seller-card" id="sellerCard">
                <img class="seller-logo" src="https://via.placeholder.com/60" id="sellerLogo" alt="Seller">
                <div class="seller-info">
                    <h4 id="sellerName">Loading seller info...<span class="verified-tick">✔️</span></h4>
                    <p id="sellerAddress"></p>
                    <p id="sellerPhone"></p>
                </div>
            </div>
        `;
    }

    async function loadSellerInfo(sellerUid) {
        if (!sellerUid) {
            document.getElementById('sellerName').innerText = 'Local Seller';
            return;
        }
        try {
            const snap = await getDoc(doc(db, "sellers_profiles", sellerUid));
            if (snap.exists()) {
                const seller = snap.data();
                document.getElementById('sellerLogo').src = seller.logo || 'https://via.placeholder.com/60';
                document.getElementById('sellerName').innerHTML = `${seller.shopName || 'Local Seller'} <span class="verified-tick">✔️ Verified</span>`;
                document.getElementById('sellerAddress').innerText = '📍 ' + (seller.address || 'Address not provided');
                document.getElementById('sellerPhone').innerText = '📞 Contact after order confirmation';
            } else {
                document.getElementById('sellerName').innerText = 'Local Seller';
            }
        } catch (e) {
            console.error(e);
        }
    }

    window.switchMainImage = function(src, thumbEl) {
        document.getElementById('mainProductImg').src = src;
        document.querySelectorAll('.thumb-strip img').forEach(t => t.classList.remove('active'));
        thumbEl.classList.add('active');
    };

    window.changeQty = function(delta) {
        currentQty = Math.max(1, currentQty + delta);
        document.getElementById('qtyDisplay').innerText = currentQty;
    };

    window.addToCart = function() {
        if (!currentProduct) return;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // If product already in cart, just bump quantity instead of duplicating
        const existing = cart.find(item => item.id === currentProduct.id);
        if (existing) {
            existing.qty = (parseInt(existing.qty) || 1) + currentQty;
        } else {
            cart.push({
                id: currentProduct.id,
                name: currentProduct.name,
                price: parseFloat(currentProduct.price) || 0,
                qty: currentQty,
                image: currentProduct.image,
                shopName: currentProduct.shopName || 'Local Shop',
                sellerUid: currentProduct.sellerUid || null
            });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartBadge();
        alert(`${currentQty} x ${currentProduct.name} added to cart! 🛍️`);
    };

    window.openBuyModal = function() {
        if (!currentProduct) return;
        const total = (parseFloat(currentProduct.price) || 0) * currentQty;
        document.getElementById('orderSummary').innerHTML = `
            <span>${currentQty} x ${currentProduct.name}</span>
            <strong>₹${total.toFixed(0)}</strong>
        `;

        // Pre-fill from saved profile if available
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (user) {
            document.getElementById('buyName').value = (user.name || '') + (user.surname ? ' ' + user.surname : '');
            document.getElementById('buyPhone').value = user.phone || '';
            document.getElementById('buyAddress').value = '';
            document.getElementById('buyCity').value = user.city || '';
            document.getElementById('buyState').value = user.state || '';
        }

        document.getElementById('buyModal').classList.add('active');
    };

    window.closeBuyModal = function() {
        document.getElementById('buyModal').classList.remove('active');
    };

    document.getElementById('submitOrderBtn').addEventListener('click', async function() {
        const name = document.getElementById('buyName').value.trim();
        const phone = document.getElementById('buyPhone').value.trim();
        const pincode = document.getElementById('buyPincode').value.trim();
        const address = document.getElementById('buyAddress').value.trim();
        const city = document.getElementById('buyCity').value.trim();
        const state = document.getElementById('buyState').value.trim();
        const payment = document.getElementById('buyPayment').value;

        if (!name || !phone || !address || !city) {
            alert('Please fill in all required delivery details.');
            return;
        }
        if (!/^\d{10}$/.test(phone)) {
            alert('Please enter a valid 10-digit mobile number.');
            return;
        }

        const btn = document.getElementById('submitOrderBtn');
        btn.disabled = true;
        btn.innerText = 'Placing order...';

        try {
            const fullAddress = `${address}, ${city}, ${state} ${pincode ? '- ' + pincode : ''}`;
            await addDoc(collection(db, "orders"), {
                productId: currentProduct.id,
                productName: currentProduct.name,
                price: (parseFloat(currentProduct.price) || 0) * currentQty,
                quantity: currentQty,
                shopName: currentProduct.shopName || 'Local Shop',
                sellerUid: currentProduct.sellerUid || null,
                buyerUid: currentBuyerUid,
                buyerName: name,
                buyerPhone: phone,
                buyerAddress: fullAddress,
                paymentMethod: payment,
                status: 'Pending',
                createdAt: new Date()
            });

            let myOrders = JSON.parse(localStorage.getItem('myOrders')) || [];
            myOrders.unshift({
                id: 'ORD' + Math.floor(100000 + Math.random() * 900000),
                name: currentProduct.name,
                price: (parseFloat(currentProduct.price) || 0) * currentQty,
                date: new Date().toLocaleDateString(),
                status: 'Pending'
            });
            localStorage.setItem('myOrders', JSON.stringify(myOrders));

            alert('Order placed successfully! 🎉 The seller has been notified.');
            window.location.href = 'orders.html';
        } catch (error) {
            console.error(error);
            alert('Error placing order: ' + error.message);
            btn.disabled = false;
            btn.innerText = 'Place Order';
        }
    });

    window.onload = function() {
        loadProduct();
        updateCartBadge();
        if (productId) loadProductReviews(db, productId);
    };
</script>
</body>
</html>
