<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product - DesiMarket</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f2f2f2; margin: 0; color: #0f1111; }
    header { background: #232f3e; padding: 14px 18px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
    .back-arrow { color: white; font-size: 20px; cursor: pointer; text-decoration: none; }
    .logo-area { color: white; font-size: 19px; font-weight: bold; text-decoration: none; flex-grow: 1; }
    .logo-area span { color: #ff9900; }
    .container { max-width: 950px; margin: 0 auto; padding: 15px; }
    .product-layout { display: flex; gap: 22px; flex-wrap: wrap; }
    .gallery { flex: 1 1 320px; background: white; border-radius: 8px; padding: 15px; text-align: center; }
    .gallery img.main-img { width: 100%; max-width: 400px; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
    .info-panel { flex: 1.3 1 380px; background: white; border-radius: 8px; padding: 20px; }
    .p-name { font-size: 21px; font-weight: 600; margin: 0 0 8px; }
    .p-price { font-size: 26px; font-weight: bold; color: #B12704; margin-bottom: 4px; }
    .loading-state, .error-state { text-align: center; padding: 60px 20px; background: white; border-radius: 8px; color: #333; font-size: 16px; }
</style>
</head>
<body>

<header>
    <a href="javascript:history.back()" class="back-arrow">⬅️</a>
    <a href="index.html" class="logo-area">Desi<span>Market</span></a>
</header>

<div class="container" id="pageContent">
    <div class="loading-state" id="loadingText">Connecting to database...</div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const content = document.getElementById('pageContent');

    // सुरक्षा टाइमर: अगर 4 सेकंड में जवाब नहीं आया, तो एरर दिखा देगा
    const safetyTimer = setTimeout(() => {
        content.innerHTML = `<div class="error-state" style="color:red;">⚠️ Connection Timeout! Firebase से जुड़ने में समय लग रहा है। कृपया अपना इंटरनेट या Firebase Config चेक करें।</div>`;
    }, 4000);

    async function testLoad() {
        try {
            if (!productId) {
                clearTimeout(safetyTimer);
                content.innerHTML = `<div class="error-state" style="color:red;">⚠️ Error: URL में Product ID (?id=...) गायब है!</div>`;
                return;
            }

            console.log("Fetching product ID:", productId);
            const docRef = doc(db, "vendors", productId);
            const snap = await getDoc(docRef);

            clearTimeout(safetyTimer);

            if (snap.exists()) {
                const data = snap.data();
                content.innerHTML = `
                    <div class="product-layout">
                        <div class="gallery">
                            <img class="main-img" src="${data.image || 'https://via.placeholder.com/400'}" alt="Product">
                        </div>
                        <div class="info-panel">
                            <h1 class="p-name">${data.name || 'Unnamed'}</h1>
                            <div class="p-price">₹${data.price || 0}</div>
                            <p style="color:green; font-weight:bold; margin-top:20px;">✅ Database Connection Successful! डेटा बिल्कुल सही लोड हो रहा है।</p>
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="error-state" style="color:red;">⚠️ Error: इस ID (${productId}) का प्रोडक्ट डेटाबेस (vendors) में मौजूद नहीं है!</div>`;
            }
        } catch (error) {
            clearTimeout(safetyTimer);
            console.error("Firebase Error:", error);
            content.innerHTML = `<div class="error-state" style="color:red; font-weight:bold;">🚨 Firebase Crash Error: ${error.message}</div>`;
        }
    }

    testLoad();
</script>
</body>
</html>
