<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        /* Header & Menu Icon Styling */
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        /* Side Menu Drawer */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #232f3e; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .side-menu a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: white; display: block; transition: 0.2s; }
        .side-menu a:hover { background-color: #37475a; }
        .side-menu .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; margin-left: 50px; }

        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; margin-top: 0; }
        
        .order-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .order-info h4 { margin: 0 0 5px 0; color: #333; }
        .order-info p { margin: 0; color: #666; font-size: 14px; }
        .order-status { font-weight: bold; color: #007600; background-color: #e7f4e4; padding: 5px 10px; border-radius: 4px; font-size: 14px; }
        .no-orders { text-align: center; color: #777; padding: 30px; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <!-- 3-Lines (Hamburger) Icon -->
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Side Slide Menu -->
    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Home</a>
        <a href="seller-dashboard.html">🛒 Seller Hub</a>
        <a href="cart.html">🛍️ Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="account.html">👤 Account</a>
    </div>

    <div class="container">
        <h2>My Order History</h2>
        <div id="ordersContainer">
            <!-- Orders will load here -->
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            if (menu.style.width === '250px') {
                menu.style.width = '0';
            } else {
                menu.style.width = '250px';
            }
        }

        function loadOrders() {
            // हम cart से आर्डर स्टोर करने का लॉजिक जोड़ सकते हैं, अभी के लिए डमी आर्डर दिखा रहे हैं
            let orders = JSON.parse(localStorage.getItem('myOrders')) || [
                { id: "ORD101", name: "Smart Watch", price: 1999, date: "13 Aug 2026", status: "Delivered" }
            ];

            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<div class="no-orders">You have no past orders yet.</div>';
                return;
            }

            orders.forEach(o => {
                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-info">
                            <h4>${o.name} (Order ID: ${o.id})</h4>
                            <p>Price: ₹${o.price} | Date: ${o.date}</p>
                        </div>
                        <div class="order-status">${o.status}</div>
                    </div>
                `;
            });
        }

        window.onload = loadOrders;
    </script>
</body>
</html>
