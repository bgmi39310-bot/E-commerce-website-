<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - DesiMarket</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }

        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 998; }
        .back-arrow { font-size: 20px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: bold; }

        .container { max-width: 800px; margin: 20px auto; padding: 15px; }

        .order-card { background: #fff; border: 1px solid #eee; border-left: 5px solid #ffd814; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
        .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .order-top h4 { margin: 0 0 4px 0; font-size: 15.5px; color: #222; }
        .order-shop { font-size: 12.5px; color: #565959; margin-bottom: 8px; }
        .order-price { font-weight: bold; color: #b12704; font-size: 15px; }

        .status-pill { font-size: 11.5px; font-weight: bold; padding: 4px 11px; border-radius: 12px; white-space: nowrap; }
        .status-Pending { background: #fff3cd; color: #8a6800; }
        .status-Accepted { background: #d1ecf1; color: #0c5460; }
        .status-Shipped { background: #cce5ff; color: #004085; }
        .status-Delivered { background: #e2d9f3; color: #4b2e83; }
        .status-Cancelled { background: #f8d7da; color: #842029; }

        .progress-track { display: flex; align-items: center; margin: 12px 0 4px; }
        .progress-step { flex: 1; height: 4px; background: #eee; border-radius: 2px; margin: 0 2px; }
        .progress-step.done { background: #28a745; }
        .progress-step.cancelled { background: #dc3545; }

        .order-date { font-size: 12px; color: #888; margin-top: 6px; }

        .delivery-code-box { background: #f3e8ff; border: 1.5px dashed #6f42c1; border-radius: 8px; padding: 12px 14px; margin: 10px 0; text-align: center; }
        .delivery-code-box .code-label { font-size: 12px; color: #4b2e83; font-weight: 600; margin-bottom: 4px; }
        .delivery-code-box .code-value { font-size: 24px; font-weight: bold; letter-spacing: 6px; color: #4b2e83; }
        .delivery-code-box .code-hint { font-size: 11.5px; color: #6f42c1; margin-top: 4px; }

        .no-orders { text-align: center; padding: 50px 20px; background: white; border-radius: 8px; color: #666; }
        .no-orders a { display: inline-block; margin-top: 12px; background: #ffd814; padding: 10px 22px; border-radius: 5px; text-decoration: none; color: #111; font-weight: bold; }

        .cancel-order-btn { display: block; margin-top: 10px; background: none; border: 1px solid #dc3545; color: #dc3545; padding: 7px 14px; border-radius: 5px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
        .cancel-order-btn:hover { background: #dc3545; color: white; }

        .login-prompt { text-align: center; padding: 50px 20px; background: white; border-radius: 8px; }
        .login-prompt a { display: inline-block; margin-top: 12px; background: #ffd814; padding: 10px 22px; border-radius: 5px; text-decoration: none; color: #111; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="back-arrow" onclick="history.back()">⬅️</div>
        <div class="header-title">My Orders</div>
    </header>

    <div class="container" id="pageContent">
        <p style="text-align:center; color:#888;">Loading your orders...</p>
    </div>

    <script type="module">
        import { db, auth } from './firebase-config.js';
        import { collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        let currentBuyerUid = null;

        const STEPS = ['Pending', 'Accepted', 'Shipped', 'Delivered'];

        function renderProgress(status) {
            if (status === 'Cancelled') {
                return `<div class="progress-track">
                    <div class="progress-step cancelled"></div>
                    <div class="progress-step cancelled"></div>
                    <div class="progress-step cancelled"></div>
                </div>`;
            }
            const currentIndex = STEPS.indexOf(status);
            let html = '<div class="progress-track">';
            STEPS.forEach((s, i) => {
                html += `<div class="progress-step ${i <= currentIndex ? 'done' : ''}"></div>`;
            });
            html += '</div>';
            return html;
        }

        function renderOrders(orders) {
            const content = document.getElementById('pageContent');
            if (orders.length === 0) {
                content.innerHTML = `<div class="no-orders">You haven't placed any orders yet.<br><a href="index.html">Start Shopping</a></div>`;
                return;
            }

            let html = '';
            orders.forEach(order => {
                const status = order.status || 'Pending';
                const dateStr = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                html += `
                    <div class="order-card">
                        <div class="order-top">
                            <div>
                                <h4>📦 ${order.productName || 'Item'} (Qty: ${order.quantity || 1})</h4>
                                <div class="order-shop">🏪 ${order.shopName || 'Local Shop'}</div>
                            </div>
                            <span class="status-pill status-${status}">${status}</span>
                        </div>
                        ${renderProgress(status)}
                        ${status === 'Shipped' && order.deliveryOTP ? `
                            <div class="delivery-code-box">
                                <div class="code-label">🔐 Your Delivery OTP</div>
                                <div class="code-value">${order.deliveryOTP}</div>
                                <div class="code-hint">Share this code with the seller ONLY after you physically receive your order</div>
                            </div>
                        ` : ''}
                        <div class="order-price">₹${order.price || 0}</div>
                        ${status === 'Pending' ? `<button class="cancel-order-btn" onclick="cancelMyOrder('${order.id}')">Cancel Order</button>` : ''}
                        <div class="order-date">${dateStr ? 'Ordered on ' + dateStr : ''}</div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        async function fetchMyOrders(uid) {
            const content = document.getElementById('pageContent');
            try {
                const q = query(collection(db, "orders"), where("buyerUid", "==", uid));
                const snapshot = await getDocs(q);
                let orders = [];
                snapshot.forEach(docSnap => orders.push({ id: docSnap.id, ...docSnap.data() }));

                // Newest first (sorted client-side to avoid needing a composite index)
                orders.sort((a, b) => {
                    const ta = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate() : 0;
                    const tb = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate() : 0;
                    return tb - ta;
                });

                renderOrders(orders);
            } catch (error) {
                console.error(error);
                content.innerHTML = `<div class="no-orders">Unable to load orders right now. Please try again.</div>`;
            }
        }

        window.cancelMyOrder = async function(orderId) {
            if (!confirm("Are you sure you want to cancel this order?")) return;
            try {
                await updateDoc(doc(db, "orders", orderId), { status: 'Cancelled', cancelledAt: new Date(), cancelledBy: 'buyer' });
                alert("Order cancelled successfully.");
                if (currentBuyerUid) fetchMyOrders(currentBuyerUid);
            } catch (error) {
                console.error(error);
                alert("Unable to cancel order right now. Please try again.");
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentBuyerUid = user.uid;
                fetchMyOrders(user.uid);
            } else {
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-prompt">
                        <p>Please login to view your orders.</p>
                        <a href="login.html">Login / Create Account</a>
                    </div>`;
            }
        });
    </script>
</body>
</html>
