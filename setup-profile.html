<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Profile - DesiMarket</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#232f3e">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="pwa-init.js" defer></script>
    <script src="click-guard.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }

        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 998; }
        .back-arrow { font-size: 22px; cursor: pointer; margin-right: 15px; }
        .header-title { flex-grow: 1; font-size: 18px; font-weight: bold; }

        .container { max-width: 600px; margin: 30px auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; margin-top: 0; text-align: center; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; color: #555; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; background: #fff; font-size: 15px; }

        .btn-save { background-color: #ffd814; color: #111; border: 1px solid #fcd200; width: 100%; padding: 12px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn-save:hover { background-color: #f7ca00; }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

        .save-msg { text-align: center; font-size: 13px; color: #28a745; margin-top: 10px; display: none; }
        .login-needed { text-align: center; padding: 40px 10px; color: #666; }
        .login-needed a { display:inline-block; margin-top:10px; background:#ffd814; padding:10px 22px; border-radius:5px; text-decoration:none; color:#111; font-weight:bold; }
    </style>
</head>
<body>

    <header>
        <div class="back-arrow" onclick="history.back()">⬅️</div>
        <div class="header-title">Setup / Edit Profile</div>
    </header>

    <div class="container" id="pageContent">
        <p style="text-align:center; color:#888;">Loading...</p>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { showToast } from './toast.js';

        let currentUid = null;

        function renderForm(existing) {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
                <h2>Complete Your Profile</h2>

                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" id="pName" placeholder="Enter first name" value="${existing.name || ''}">
                </div>
                <div class="form-group">
                    <label>Surname (Last Name):</label>
                    <input type="text" id="pSurname" placeholder="Enter surname" value="${existing.surname || ''}">
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="text" id="pPhone" placeholder="Enter phone number" value="${existing.phone || ''}">
                </div>
                <div class="form-group">
                    <label>State (Pradesh):</label>
                    <input type="text" id="pState" placeholder="e.g. Uttar Pradesh / Bihar" value="${existing.state || ''}">
                </div>
                <div class="form-group">
                    <label>District (Zila):</label>
                    <input type="text" id="pDistrict" placeholder="Enter district" value="${existing.district || ''}">
                </div>
                <div class="form-group">
                    <label>City / Village:</label>
                    <input type="text" id="pCity" placeholder="Enter city or village" value="${existing.city || ''}">
                </div>
                <div class="form-group">
                    <label>Profile Photo Link (Postimages / Image URL):</label>
                    <input type="url" id="pPhoto" placeholder="https://i.postimg.cc/..." value="${existing.photo || ''}">
                </div>

                <button class="btn-save" id="saveBtn">Save Profile</button>
                <p class="save-msg" id="saveMsg">Profile updated successfully!</p>
            `;

            document.getElementById('saveBtn').addEventListener('click', saveProfile);
        }

        async function loadExistingProfile(uid) {
            try {
                const snap = await getDoc(doc(db, "users", uid));
                renderForm(snap.exists() ? snap.data() : {});
            } catch (error) {
                console.error(error);
                renderForm({});
            }
        }

        async function saveProfile() {
            const name = document.getElementById('pName').value.trim();
            const phone = document.getElementById('pPhone').value.trim();

            if (!name || !phone) {
                showToast("Please enter at least your Name and Phone Number!", 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = 'Saving...';

            const userData = {
                name: name,
                surname: document.getElementById('pSurname').value.trim(),
                phone: phone,
                state: document.getElementById('pState').value.trim(),
                district: document.getElementById('pDistrict').value.trim(),
                city: document.getElementById('pCity').value.trim(),
                photo: document.getElementById('pPhoto').value.trim(),
                updatedAt: new Date()
            };

            try {
                // setDoc with merge:true updates the SAME document each time,
                // instead of creating a new duplicate document on every save.
                await setDoc(doc(db, "users", currentUid), userData, { merge: true });

                document.getElementById('saveMsg').style.display = 'block';
                setTimeout(() => { window.location.href = "account.html"; }, 900);
            } catch (error) {
                console.error(error);
                showToast("Error saving profile: " + error.message, 'error');
                btn.disabled = false;
                btn.innerText = 'Save Profile';
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-needed">
                        <p>Please login first to set up your profile.</p>
                        <a href="login.html">Login / Create Account</a>
                    </div>`;
                return;
            }
            currentUid = user.uid;
            loadExistingProfile(user.uid);
        });
    </script>
</body>
</html>
