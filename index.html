<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #232f3e; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .side-menu a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: white; display: block; transition: 0.2s; }
        .side-menu a:hover { background-color: #37475a; }
        .side-menu .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; margin-left: 50px; }

        .search-container { text-align: center; padding: 20px; background-color: #eaeded; }
        .search-box { width: 80%; max-width: 600px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; outline: none; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 170px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; background-color: #eee; cursor: pointer; }
        
        .product-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .product-price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        
        /* Fixed small and clean seller badge */
        .seller-info { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 6px 8px; border-radius: 5px; margin-bottom: 12px; border: 1px solid #eee; font-size: 12px; color: #555; }
        .seller-logo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #ddd; flex-shrink: 0; }
        .seller-details div { font-weight: bold; color: #333; }

        .qty-box { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; background: #fdfdfd; padding: 6px; border: 1px solid #ddd; border-radius: 5px; font-size: 13px; }
        .qty-box input { width: 60px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold; }

        .btn-group { display: flex; gap: 8px; }
        .btn-view { background-color: #e7e9ec; border: 1px solid #adb1b8; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 5px; flex: 1; font-size: 13px; }
        .btn-cart { background-color: #ffd814; border: 1px solid #fcd200; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 5px; flex: 1; font-size: 13px; }
        .btn-cart:hover { background-color: #f7ca00; }
        .btn-view:hover { background-color: #d8dadf; }

        /* Modal Overlay & Improved Back/Close options */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 10px; box-sizing: border-box; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 10px; padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .close-modal { position: absolute; top: 12px; right: 18px; font-size: 28px; cursor: pointer; font-weight: bold; color: #555; }
        .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .spec-badge { display: inline-block; background: #f0f2f2; border: 1px solid #d5d9d9; padding: 6px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; margin-right: 5px; margin-bottom: 10px; }
        
        .btn-back { background-color: #eaeded; border: 1px solid #d5d9d9; color: #111; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; font-size: 14px; margin-top: 8px; }
        .btn-back:hover { background-color: #d8dadf; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Home</a>
        <a href="seller-dashboard.html">🛒 Seller Hub</a>
        <a href="cart.html">🛍️ Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="account.html">👤 Account</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search products, materials, or shops..." onkeyup="searchProducts()">
    </div>

    <div class="container">
        <h2>Trending Products & Verified Shops</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Details Modal Pop-Up with Back Button -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="mImg" class="modal-img" src="" alt="Product">
            <h2 id="mTitle" style="margin-bottom: 5px; font-size: 20px;">Product Title</h2>
            <div id="mPrice" style="color: #b12704; font-size: 20px; font-weight: bold; margin-bottom: 12px;">₹0</div>
            
            <div>
                <span class="spec-badge" id="mMaterial">🧵 Material: N/A</span>
                <span class="spec-badge" id="mWarranty">⏳ Warranty: N/A</span>
            </div>

            <div style="margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px;">
                <h4 style="margin-bottom: 5px; color: #232f3e;">Product Description (विवरण):</h4>
                <p id="mDesc" style="color: #555; line-height: 1.4; margin-top: 0; font-size: 14px;">Description goes here...</p>
            </div>

            <div class="seller-info" style="margin-top: 12px; padding: 8px;">
                <img id="mShopLogo" class="seller-logo" src="" alt="Shop">
                <div class="seller-details">
                    <div id="mShopName" style="font-size: 13px;">🏪 Shop Name</div>
                    <small id="mShopOwner" style="font-size: 11px;">By: Owner</small> | <small id="mShopAddr" style="font-size: 11px;">Address</small>
                </div>
            </div>

            <div class="qty-box" style="margin-top: 12px;">
                <span>मात्रा (Quantity):</span>
                <input type="number" id="mQtyInput" value="1" min="1">
                <span id="mUnitLabel">Piece</span>
            </div>

            <button id="mCartBtn" class="btn-cart" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 5px;">Add to Cart</button>
            
            <!-- साफ़ बैक/क्लोज़ बटन ताकि होम बटन पर न जाना पड़े -->
            <button class="btn-back" onclick="closeModal()">⬅️ Back / Close</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.style.width = menu.style.width === '250px' ? '0' : '250px';
        }

        let currentProductsList = [];

        function getAllProducts() {
            const defaultProducts = [
                { 
                    name: "Desi Wheat (गेहूं)", 
                    price: 30, 
                    unit: "Per Kg",
                    material: "Pure Organic Grain",
                    warranty: "Fresh Crop Quality",
                    description: "High quality clean local wheat, best for daily flour (aata) and meals.",
                    image: "https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=300&auto=format&fit=crop&q=80",
                    shopName: "Kisan Anaj Bhandar",
                    ownerName: "Ramesh Singh",
                    shopAddress: "Main Mandi Road"
                },
                { 
                    name: "Running Shoes", 
                    price: 2499, 
                    unit: "Per Piece",
                    material: "Breathable Mesh & EVA Sole",
                    warranty: "6 Months Sole Warranty",
                    description: "Lightweight and comfortable sports shoes, ideal for daily running and gym.",
                    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&auto=format&fit=crop&q=80",
                    shopName: "Desi Sports Hub",
                    ownerName: "Amit Verma",
                    shopAddress: "Station Road, Indore"
                }
            ];
            
            const sellerProducts = JSON.parse(localStorage.getItem('sellerProducts')) || [];
            currentProductsList = [...defaultProducts, ...sellerProducts];
            return currentProductsList;
        }

        function displayProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            items.forEach((p, index) => {
                let imgSource = p.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=80";
                let shopName = p.shopName || "Verified Local Shop";
                let ownerName = p.ownerName || "Trusted Seller";
                let shopLogo = p.shopLogo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80";
                let unitText = p.unit || "Per Piece";

                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${imgSource}" alt="${p.name}" onclick="openModal(${index})">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">₹${p.price} <span style="font-size:12px; color:#666; font-weight:normal;">/ ${unitText}</span></div>
                        
                        <div class="qty-box">
                            <label>Qty:</label>
                            <input type="number" id="qty_${index}" value="1" min="1">
                            <span style="font-size:11px; color:#555;">${unitText.replace('Per ', '')}</span>
                        </div>

                        <!-- Chota aur saaf seller badge -->
                        <div class="seller-info">
                            <img src="${shopLogo}" class="seller-logo" alt="Shop">
                            <div class="seller-details">
                                <div>🏪 ${shopName}</div>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="btn-view" onclick="openModal(${index})">🔍 Details</button>
                            <button class="btn-cart" onclick="addToCartFromHome(${index})">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const p = currentProductsList[index];
            let unitText = p.unit || "Per Piece";

            document.getElementById('mImg').src = p.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=80";
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mPrice').innerText = "₹" + p.price + " / " + unitText;
            document.getElementById('mMaterial').innerText = "🧵 Material: " + (p.material || 'Standard');
            document.getElementById('mWarranty').innerText = "⏳ Validity: " + (p.warranty || 'Standard Quality');
            document.getElementById('mDesc').innerText = p.description || "No specific details provided.";
            
            document.getElementById('mShopName').innerText = "🏪 " + (p.shopName || 'Local Shop');
            document.getElementById('mShopOwner').innerText = "By: " + (p.ownerName || 'Verified Seller');
            document.getElementById('mShopAddr').innerText = p.shopAddress || '';
            document.getElementById('mShopLogo').src = p.shopLogo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80";
            
            document.getElementById('mQtyInput').value = 1;
            document.getElementById('mUnitLabel').innerText = unitText.replace('Per ', '');

            document.getElementById('mCartBtn').onclick = function() {
                const qty = Number(document.getElementById('mQtyInput').value) || 1;
                saveToCart(p, qty);
                closeModal();
            };

            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function addToCartFromHome(index) {
            const p = currentProductsList[index];
            const qty = Number(document.getElementById('qty_' + index).value) || 1;
            saveToCart(p, qty);
        }

        function saveToCart(p, qty) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let unitText = p.unit || "Per Piece";
            
            let existingItem = cart.find(item => item.name === p.name && item.shopName === p.shopName);
            
            if (existingItem) {
                existingItem.quantity += qty;
            } else {
                cart.push({ 
                    name: p.name, 
                    price: Number(p.price), 
                    unit: unitText,
                    quantity: qty, 
                    image: p.image, 
                    shopName: p.shopName || 'Local Shop' 
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(qty + " " + unitText.replace('Per ', '') + " of " + p.name + " added to your cart! (Total: ₹" + (p.price * qty) + ")");
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = getAllProducts().filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.shopName.toLowerCase().includes(query) ||
                (p.material && p.material.toLowerCase().includes(query))
            );
            displayProducts(filtered);
        }

        window.onload = function() {
            displayProducts(getAllProducts());
        };
    </script>
</body>
</html>
