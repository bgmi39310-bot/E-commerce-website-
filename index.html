<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiMarket - Buy & Sell</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        header { background-color: #232f3e; color: white; padding: 12px 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
        header h2 { margin: 0; font-size: 20px; }
        .search-box { flex-grow: 1; max-width: 300px; padding: 6px 10px; border-radius: 4px; border: none; }
        .nav-links { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-links a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
        .nav-links a:hover { text-decoration: underline; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .hero { background: white; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .product-title { font-weight: bold; font-size: 16px; margin: 10px 0 5px; color: #333; }
        .price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .desc { font-size: 14px; color: #666; margin-bottom: 15px; flex-grow: 1; }
        .btn { background-color: #ffd814; border: 1px solid #fcd200; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .btn:hover { background-color: #f7ca00; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Search products...">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="seller-dashboard.html">Dashboard</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
            <a href="account.html">Account</a>
            <a href="login.html">Login</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Welcome to DesiMarket</h1>
            <p>Buy and sell products easily in your community!</p>
        </div>

        <h2>Featured Products</h2>
        <div class="product-grid" id="productGrid">
            <!-- Products will load dynamically -->
        </div>
    </div>

    <script>
        function loadProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const defaultProducts = [
                { name: "Wireless Headphones", price: "1499", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", desc: "High quality wireless headphones with deep bass." },
                { name: "Smart Watch", price: "2499", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", desc: "Fitness tracker and smartwatch with AMOLED display." },
                { name: "Smart Watch", price: "1999", image: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500", desc: "Feature-packed smart watch with fitness tracking." },
                { name: "Running Shoes", price: "2499", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", desc: "Comfortable and durable sports shoes." }
            ];

            let userProducts = JSON.parse(localStorage.getItem('products')) || [];
            let allProducts = [...defaultProducts, ...userProducts];

            allProducts.forEach((product) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <div class="product-title">${product.name}</div>
                    <div class="price">₹${product.price}</div>
                    <div class="desc">${product.desc}</div>
                    <button class="btn" onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const productCards = document.querySelectorAll('.product-card');

            productCards.forEach(card => {
                const title = card.querySelector('.product-title').innerText.toLowerCase();
                if (title.includes(searchTerm)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        function addToCart(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(product.name + " has been added to your cart!");
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
