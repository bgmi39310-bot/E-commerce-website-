<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #232f3e; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .side-menu a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: white; display: block; transition: 0.2s; }
        .side-menu a:hover { background-color: #37475a; }
        .side-menu .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; margin-left: 50px; }

        .search-container { text-align: center; padding: 20px; background-color: #eaeded; }
        .search-box { width: 80%; max-width: 600px; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; outline: none; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 170px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; background-color: #eee; cursor: pointer; }
        
        .product-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .product-price { color: #b12704; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
        
        .seller-info { display: flex; align-items: center; gap: 8px; background: #f8f9fa; padding: 8px; border-radius: 5px; margin-bottom: 12px; border: 1px solid #eee; font-size: 13px; color: #555; }
        .seller-logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #ddd; }
        .seller-details div { font-weight: bold; color: #333; }

        .btn-group { display: flex; gap: 8px; }
        .btn-view { background-color: #e7e9ec; border: 1px solid #adb1b8; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 5px; flex: 1; font-size: 13px; }
        .btn-cart { background-color: #ffd814; border: 1px solid #fcd200; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 5px; flex: 1; font-size: 13px; }
        .btn-cart:hover { background-color: #f7ca00; }
        .btn-view:hover { background-color: #d8dadf; }

        /* Modal / Popup Styling for Product Details */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 90%; max-width: 550px; border-radius: 10px; padding: 20px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 12px; right: 18px; font-size: 28px; cursor: pointer; font-weight: bold; color: #555; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .spec-badge { display: inline-block; background: #f0f2f2; border: 1px solid #d5d9d9; padding: 6px 12px; border-radius: 15px; font-size: 13px; font-weight: bold; margin-right: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Home</a>
        <a href="seller-dashboard.html">🛒 Seller Hub</a>
        <a href="cart.html">🛍️ Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="account.html">👤 Account</a>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Search products, materials, or shops..." onkeyup="searchProducts()">
    </div>

    <div class="container">
        <h2>Trending Products & Verified Shops</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <!-- Details Modal Pop-Up -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="mImg" class="modal-img" src="" alt="Product">
            <h2 id="mTitle" style="margin-bottom: 5px;">Product Title</h2>
            <div id="mPrice" style="color: #b12704; font-size: 22px; font-weight: bold; margin-bottom: 15px;">₹0</div>
            
            <div>
                <span class="spec-badge" id="mMaterial">🧵 Material: N/A</span>
                <span class="spec-badge" id="mWarranty">⏳ Warranty: N/A</span>
            </div>

            <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
                <h4 style="margin-bottom: 5px; color: #232f3e;">Product Description (विवरण):</h4>
                <p id="mDesc" style="color: #555; line-height: 1.5; margin-top: 0;">Description goes here...</p>
            </div>

            <div class="seller-info" style="margin-top: 15px;">
                <img id="mShopLogo" class="seller-logo" src="" alt="Shop">
                <div class="seller-details">
                    <div id="mShopName">🏪 Shop Name</div>
                    <small id="mShopOwner">By: Owner</small> | <small id="mShopAddr">Address</small>
                </div>
            </div>

            <button id="mCartBtn" class="btn-cart" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 15px;">Add to Cart</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.style.width = menu.style.width === '250px' ? '0' : '250px';
        }

        let currentProductsList = [];

        function getAllProducts() {
            const defaultProducts = [
                { 
                    name: "Smart Watch", 
                    price: 1999, 
                    material: "Silicone Strap & Alloy Dial",
                    warranty: "1 Year Manufacturer Warranty",
                    description: "High-definition display smart watch with heart rate sensor, waterproof body, and long battery life up to 7 days.",
                    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=80",
                    shopName: "Tech Gadgets Store",
                    ownerName: "Rahul Sharma",
                    shopAddress: "Main Market, Bhopal"
                },
                { 
                    name: "Running Shoes", 
                    price: 2499, 
                    material: "Breathable Mesh & EVA Sole",
                    warranty: "6 Months Sole Warranty",
                    description: "Lightweight and comfortable sports shoes, ideal for daily running, gym, and outdoor sports. Durable rubber grip.",
                    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300&auto=format&fit=crop&q=80",
                    shopName: "Desi Sports Hub",
                    ownerName: "Amit Verma",
                    shopAddress: "Station Road, Indore"
                }
            ];
            
            const sellerProducts = JSON.parse(localStorage.getItem('sellerProducts')) || [];
            currentProductsList = [...defaultProducts, ...sellerProducts];
            return currentProductsList;
        }

        function displayProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            items.forEach((p, index) => {
                let imgSource = p.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=80";
                let shopName = p.shopName || "Verified Local Shop";
                let ownerName = p.ownerName || "Trusted Seller";
                let shopLogo = p.shopLogo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80";

                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${imgSource}" alt="${p.name}" onclick="openModal(${index})">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">₹${p.price}</div>
                        
                        <div class="seller-info">
                            <img src="${shopLogo}" class="seller-logo" alt="Shop">
                            <div class="seller-details">
                                <div>🏪 ${shopName}</div>
                                <small>By: ${ownerName}</small>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button class="btn-view" onclick="openModal(${index})">🔍 Details</button>
                            <button class="btn-cart" onclick="addToCart('${p.name}', ${p.price}, '${imgSource}', '${shopName}')">Add to Cart</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const p = currentProductsList[index];
            document.getElementById('mImg').src = p.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&auto=format&fit=crop&q=80";
            document.getElementById('mTitle').innerText = p.name;
            document.getElementById('mPrice').innerText = "₹" + p.price;
            document.getElementById('mMaterial').innerText = "🧵 Material: " + (p.material || 'Standard');
            document.getElementById('mWarranty').innerText = "⏳ Validity: " + (p.warranty || 'Standard Quality');
            document.getElementById('mDesc').innerText = p.description || "No specific details provided.";
            
            document.getElementById('mShopName').innerText = "🏪 " + (p.shopName || 'Local Shop');
            document.getElementById('mShopOwner').innerText = "By: " + (p.ownerName || 'Verified Seller');
            document.getElementById('mShopAddr').innerText = p.shopAddress || '';
            document.getElementById('mShopLogo').src = p.shopLogo || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80";

            document.getElementById('mCartBtn').onclick = function() {
                addToCart(p.name, p.price, p.image, p.shopName);
                closeModal();
            };

            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = getAllProducts().filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.shopName.toLowerCase().includes(query) ||
                (p.material && p.material.toLowerCase().includes(query))
            );
            displayProducts(filtered);
        }

        function addToCart(name, price, image, shopName) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let existingItem = cart.find(item => item.name === name);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name, price: Number(price), image, shopName: shopName || 'Local Shop', quantity: 1 });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(name + " added to your cart!");
        }

        window.onload = function() {
            displayProducts(getAllProducts());
        };
    </script>
</body>
</html>
