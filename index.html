<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesiMarket - प्रोडक्ट जोड़ें और देखें</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .form-container, .products-section { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background: #218838; }
        .product-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; width: 220px; border-radius: 6px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- फॉर्म सेक्शन: प्रोडक्ट जोड़ने के लिए -->
    <div class="form-container">
        <h2>नया प्रोडक्ट जोड़ें (Postimages लिंक के साथ)</h2>
        <form id="productForm">
            <label>उत्पाद का नाम:</label>
            <input type="text" id="productName" placeholder="जैसे: शर्ट, मोबाइल" required>
            
            <label>कीमत (₹):</label>
            <input type="number" id="productPrice" placeholder="जैसे: 500" required>
            
            <label>इमेज का डायरेक्ट लिंक (Postimages से कॉपी किया हुआ):</label>
            <input type="url" id="productImage" placeholder="https://i.postimg.cc/..." required>
            
            <button type="submit" id="saveBtn">प्रोडक्ट सेव करें</button>
        </form>
    </div>

    <!-- डिस्प्ले सेक्शन: प्रोडक्ट्स दिखने के लिए -->
    <div class="products-section">
        <h2>उपलब्ध प्रोडक्ट्स</h2>
        <div id="productContainer" class="product-grid">
            <!-- यहाँ डेटाबेस से प्रोडक्ट्स अपने आप लोड होंगे -->
        </div>
    </div>

    <!-- जावास्क्रिप्ट कोड (Firebase SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ⚠️ यहाँ अपनी खुद की Firebase प्रोजेक्ट की डिटेल्स डालें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase इनिशियलाइज करें
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const productForm = document.getElementById('productForm');
        const productContainer = document.getElementById('productContainer');

        // 1. डेटा सेव करने का कोड (Form Submit पर)
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const imageUrl = document.getElementById('productImage').value;

            try {
                // Firestore में 'products' कलेक्शन के अंदर नाम को डॉक्यूमेंट आईडी बनाकर सेव करें
                await setDoc(doc(db, "products", name), {
                    productName: name,
                    productPrice: price,
                    imageLink: imageUrl,
                    createdAt: new Date()
                });

                alert("प्रोडक्ट सफलताપूर्वक सेव हो गया!");
                productForm.reset();
                loadProducts(); // नया डेटा सेव होते ही लिस्ट रिफ्रेश करें
            } catch (error) {
                console.error("एरर आ गया: ", error);
                alert("डेटा सेव नहीं हो पाया।");
            }
        });

        // 2. डेटाबेस से प्रोडक्ट्स लोड करके स्क्रीन पर दिखाने का कोड
        async function loadProducts() {
            productContainer.innerHTML = "<p>लोड हो रहा है...</p>";
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productContainer.innerHTML = ""; // पुराना टेक्स्ट हटाएं

                if (querySnapshot.empty) {
                    productContainer.innerHTML = "<p>कोई प्रोडक्ट उपलब्ध नहीं है।</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    
                    // कार्ड डिजाइन जिसमें इमेज लिंक सीधे img src में जा रहा है
                    const cardHTML = `
                        <div class="product-card">
                            <img src="${product.imageLink}" alt="Product Image" onerror="this.src='https://via.placeholder.com/150?text=Invalid+Link'">
                            <h3>${product.productName}</h3>
                            <p>कीमत: ₹${product.productPrice}</p>
                        </div>
                    `;
                    productContainer.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("डेटा लोड करने में एरर:", error);
                productContainer.innerHTML = "<p>प्रोडक्ट लोड करने में समस्या आई।</p>";
            }
        }

        // पेज खुलते ही प्रोडक्ट्स को लोड करें
        loadProducts();
    </script>
</body>
</html>
