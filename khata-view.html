<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Hisab - DesiMarket Khata</title>
    <link rel="icon" href="icon-192.png">
    <meta name="theme-color" content="#232f3e">
    <link rel="stylesheet" href="khata-ui.css">
    <link rel="stylesheet" href="ui-kit.css">
</head>
<body>
    <header class="k-head"><h1>📒 Hisab (sirf dekhne ke liye)</h1></header>
    <div class="wrap">
        <div class="card" id="head"><div class="empty" style="padding:10px;">Load ho raha hai...</div></div>
        <div id="payBox"></div>
        <div class="month-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <strong id="monthTitle"></strong>
            <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="stats" id="stats"></div>
        <div id="entries"></div>
        <div class="row-btns no-print" style="margin-top:12px;">
            <button class="btn alt" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
        <div class="sticky-sum no-print">Ye hisab dukandaar ne likha hai. Kuch galat lage to dukandaar se baat kijiye. DesiMarket me login karke aap entry par sawal bhi puchh sakte hain.</div>
    </div>
    <script type="module">
        import { BACKEND_BASE_URL } from './order-api.js';
        import { escapeHtml } from './sanitize.js';
        import { rupees, monthLabel, shiftMonth, currentMonthIST, balanceLabel, entryHtml, upiLink } from './khata-api.js';

        const token = new URLSearchParams(location.search).get('t') || '';
        let month = currentMonthIST();
        const $ = (id) => document.getElementById(id);

        async function load() {
            $('entries').innerHTML = '<div class="empty">Load ho raha hai...</div>';
            try {
                const res = await fetch(`${BACKEND_BASE_URL}/api/khata/public/${encodeURIComponent(token)}?month=${month}`);
                const d = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(d.error || 'Hisab load nahi ho paya.');
                const a = d.account, b = balanceLabel(a.balance);
                $('head').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                    <div><div style="font-weight:700;font-size:16px;">🏪 ${escapeHtml(a.shopName)}</div>
                    <div style="font-size:12.5px;color:#666;">Khata: ${escapeHtml(a.customerName)}</div></div>
                    <div class="bal ${b.cls}" style="font-size:18px;">${b.text}</div></div>`;
                $('payBox').innerHTML = a.balance > 0 && a.shopUpiId ? `<div class="pay-box no-print">
                    <div style="font-weight:700;">💸 Baaki: ${rupees(a.balance)}</div>
                    <div class="row-btns"><button class="btn green" id="upiBtn">UPI se chukao</button></div>
                    <div style="font-size:12px;color:#555;margin-top:6px;">Paise bhejne ke baad dukandaar ko bata dijiye, wo hisab me likh dega.</div></div>` : '';
                const ub = $('upiBtn');
                if (ub) ub.onclick = () => { location.href = upiLink(a.shopUpiId, a.shopName, a.balance, 'Khata ' + a.customerName); };
                $('monthTitle').textContent = monthLabel(d.month);
                const ob = balanceLabel(d.openingBalance);
                $('stats').innerHTML = `
                    <div class="stat"><div class="v">${rupees(d.monthCharged)}</div><div class="l">Is mahine ka maal</div></div>
                    <div class="stat"><div class="v">${rupees(d.monthPaid)}</div><div class="l">Is mahine diye</div></div>
                    <div class="stat wide"><div class="l">Mahine ki shuruat ka hisab: ${ob.text}</div></div>`;
                const rows = d.entries.filter(e => e.type !== 'claim');
                $('entries').innerHTML = rows.length ? [...rows].reverse().map(e => entryHtml(e, 'public')).join('')
                    : '<div class="empty">Is mahine koi entry nahi.</div>';
            } catch (e) {
                $('head').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
                $('entries').innerHTML = ''; $('stats').innerHTML = '';
            }
        }
        window.changeMonth = (d) => { month = shiftMonth(month, d); load(); };
        if (!token) { $('head').innerHTML = '<div class="empty">Link adhura hai.</div>'; } else { load(); }
    </script>
</body>
</html>
