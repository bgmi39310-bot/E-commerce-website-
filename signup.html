<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - DesiMarket</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#232f3e">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="shared-ui.css">
    <script src="pwa-init.js" defer></script>
    <script src="click-guard.js"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
</script>
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f2f2f2; margin: 0; padding: 0; color: #0f1111; }

    header { background-color: #232f3e; padding: 14px 20px; display: flex; align-items: center; justify-content: center; }
    .logo-area { color: white; font-size: 22px; font-weight: bold; text-decoration: none; }
    .logo-area span { color: #ff9900; }

    .wrapper { display: flex; justify-content: center; padding: 30px 15px 60px; }
    .auth-box { background: white; width: 100%; max-width: 400px; border: 1px solid #ddd; border-radius: 8px; padding: 25px 25px 20px; }
    .auth-box h1 { font-size: 22px; margin: 0 0 4px; font-weight: 500; }
    .auth-box .sub { font-size: 13px; color: #565959; margin-bottom: 18px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 9px 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; outline: none; }
    .form-group input:focus { border-color: #e77600; box-shadow: 0 0 3px 2px #e77600aa; }
    .hint { font-size: 12px; color: #767676; margin-top: 3px; }

    .password-wrap { position: relative; }
    .toggle-pass { position: absolute; right: 10px; top: 9px; font-size: 12px; color: #007185; cursor: pointer; user-select: none; }

    /* Role Selector Cards */
    .role-selector { display: flex; gap: 10px; margin-bottom: 16px; }
    .role-card { flex: 1; border: 2px solid #d5d9d9; border-radius: 6px; padding: 12px 8px; text-align: center; cursor: pointer; transition: 0.15s; }
    .role-card .emoji { font-size: 22px; display: block; margin-bottom: 4px; }
    .role-card .label { font-size: 13px; font-weight: bold; }
    .role-card.active { border-color: #e77600; background: #fff3e0; }

    .error-box { background: #fdf2f2; border: 1px solid #f5c2c7; color: #b02a37; font-size: 13px; padding: 8px 10px; border-radius: 4px; margin-bottom: 14px; display: none; }

    .terms-check { display: flex; align-items: flex-start; gap: 8px; margin: 16px 0; }
    .terms-check input { margin-top: 3px; width: auto; flex-shrink: 0; }
    .terms-check label { font-size: 13px; color: #333; line-height: 1.5; }
    .terms-check a { color: #007185; text-decoration: none; }
    .terms-check a:hover { text-decoration: underline; color: #c7511f; }

    .btn-primary { width: 100%; background: linear-gradient(to bottom,#f7dfa5,#f0c14b); border: 1px solid #a88734; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-primary:hover { background: linear-gradient(to bottom,#f5d78e,#eeb933); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .divider { display: flex; align-items: center; margin: 20px 0 14px; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #e7e7e7; }
    .divider span { padding: 0 10px; font-size: 12px; color: #767676; }

    .btn-secondary { display: block; width: 100%; text-align:center; background: #f0f2f2; border: 1px solid #adb1b8; padding: 9px; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; color: #0f1111; }
    .btn-secondary:hover { background: #e3e6e6; }

    footer { text-align: center; font-size: 11.5px; color: #767676; padding: 20px; border-top: 1px solid #e7e7e7; margin-top: 20px; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo-area">Desi<span>Market</span></a>
</header>

<div class="wrapper">
    <div class="auth-box">
        <h1>Create account</h1>
        <p class="sub">Join DesiMarket in seconds</p>

        <div id="errorBox" class="error-box"></div>

        <label style="display:block; font-size:13px; font-weight:bold; margin-bottom:6px;">I want to join as:</label>
        <div class="role-selector">
            <div class="role-card" id="roleCustomer" onclick="selectRole('customer')">
                <span class="emoji">🛍️</span>
                <span class="label">Customer</span>
            </div>
            <div class="role-card" id="roleSeller" onclick="selectRole('seller')">
                <span class="emoji">🏪</span>
                <span class="label">Seller</span>
            </div>
        </div>

        <div class="form-group">
            <label for="name">Your Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" placeholder="At least 6 characters">
                <span class="toggle-pass" id="togglePass">SHOW</span>
            </div>
            <div class="hint">Use 6 or more characters with a mix of letters and numbers.</div>
        </div>

        <div class="terms-check">
            <input type="checkbox" id="termsCheck">
            <label for="termsCheck">I agree to DesiMarket's <a href="terms.html" target="_blank">Terms & Conditions</a> and <a href="terms.html#privacy" target="_blank">Privacy Policy</a>.</label>
        </div>

        <button class="btn-primary" id="signupBtn">Create your DesiMarket account</button>

        <button id="googleSignUpBtn" style="width:100%; background:white; border:1px solid #ddd; padding:10px; border-radius:6px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px;">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:16px;"> Continue with Google
        </button>

        <div class="divider"><hr><span>OR</span><hr></div>

        <a href="login.html" class="btn-secondary">Already have an account? Login</a>
    </div>
</div>

<footer>&copy; 2026 DesiMarket. Vocal for Local.</footer>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { createUserWithEmailAndPassword, updateProfile, GoogleAuthProvider, signInWithPopup, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let selectedRole = 'customer';

    // Pre-select role from URL, e.g. signup.html?role=seller
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'seller') selectedRole = 'seller';

    window.selectRole = function(role) {
        selectedRole = role;
        document.getElementById('roleCustomer').classList.toggle('active', role === 'customer');
        document.getElementById('roleSeller').classList.toggle('active', role === 'seller');
    };
    selectRole(selectedRole);

    document.getElementById('togglePass').addEventListener('click', () => {
        const passInput = document.getElementById('password');
        const isPassword = passInput.type === 'password';
        passInput.type = isPassword ? 'text' : 'password';
        document.getElementById('togglePass').innerText = isPassword ? 'HIDE' : 'SHOW';
    });

    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.innerText = msg;
        box.style.display = 'block';
    }
    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }

    function friendlyError(code) {
        switch (code) {
            case 'auth/email-already-in-use': return 'An account with this email already exists. Try logging in instead.';
            case 'auth/invalid-email': return 'Please enter a valid email address.';
            case 'auth/weak-password': return 'Password should be at least 6 characters.';
            default: return 'Something went wrong. Please try again.';
        }
    }

    const signupBtn = document.getElementById('signupBtn');

    async function handleSignup() {
        hideError();
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const termsChecked = document.getElementById('termsCheck').checked;

        if (!name || !phone || !email || !password) {
            showError('Please fill in all fields.');
            return;
        }
        if (!/^\d{10}$/.test(phone)) {
            showError('Please enter a valid 10-digit mobile number.');
            return;
        }
        if (!termsChecked) {
            showError('Please agree to the Terms & Conditions to continue.');
            return;
        }

        signupBtn.disabled = true;
        signupBtn.innerText = 'Creating account...';

        try {
            const cred = await createUserWithEmailAndPassword(auth, email, password);
            const uid = cred.user.uid;

            await updateProfile(cred.user, { displayName: name });
            sendEmailVerification(cred.user).catch(() => {}); // best-effort, never blocks signup

            await setDoc(doc(db, "users", uid), {
                uid: uid,
                name: name,
                phone: phone,
                email: email,
                role: selectedRole,
                createdAt: new Date()
            });

            window.location.href = selectedRole === 'seller' ? 'seller-dashboard.html' : 'index.html';
        } catch (error) {
            console.error(error);
            showError(friendlyError(error.code));
            signupBtn.disabled = false;
            signupBtn.innerText = 'Create your DesiMarket account';
        }
    }

    signupBtn.addEventListener('click', handleSignup);

    document.getElementById('googleSignUpBtn').addEventListener('click', async () => {
        hideError();
        try {
            const provider = new GoogleAuthProvider();
            const cred = await signInWithPopup(auth, provider);
            const user = cred.user;

            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                name: user.displayName || 'DesiMarket User',
                email: user.email || '',
                role: selectedRole,
                createdAt: new Date()
            }, { merge: true });

            window.location.href = selectedRole === 'seller' ? 'seller-dashboard.html' : 'index.html';
        } catch (error) {
            console.error(error);
            if (error.code !== 'auth/popup-closed-by-user') {
                showError('Google sign-in failed. Please try again.');
            }
        }
    });
</script>
</body>
</html>
