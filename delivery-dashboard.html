<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SKX86X8V6K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SKX86X8V6K');
    </script>
    <title>Delivery Partner Hub - DesiMarket</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#232f3e">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="shared-ui.css">
    <script src="pwa-init.js" defer></script>
    <script src="click-guard.js" defer></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 998; }
        .header-title { font-size: 18px; font-weight: bold; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .header-actions a, .header-actions button { color: white; text-decoration: none; font-size: 13px; background: none; border: 1px solid rgba(255,255,255,.4); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .container { max-width: 700px; margin: 0 auto; padding: 16px; }
        .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
        .tab-btn { flex-shrink: 0; padding: 9px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; font-size: 13px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: #232f3e; color: white; border-color: #232f3e; }
        .card { background: white; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin: 0 0 14px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-grid input, .form-grid select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .full-width { grid-column: 1 / -1; }
        .action-btn { background: #232f3e; color: white; border: none; padding: 11px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; min-height: 42px; }
        .action-btn.secondary { background: #f0f2f2; color: #111; border: 1px solid #ccc; }
        .availability-banner { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 600; }
        .availability-banner.available { background: #eafaf1; color: #1a7f4b; }
        .availability-banner.busy { background: #fdecea; color: #c0392b; }
        .availability-banner button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-box { background: white; border-radius: 10px; padding: 14px 8px; text-align: center; }
        .stat-box .num { font-size: 22px; font-weight: 800; color: #232f3e; }
        .stat-box .lbl { font-size: 11.5px; color: #767676; margin-top: 2px; }
        .job-card, .delivery-card, .history-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .job-card h4, .delivery-card h4, .history-card h4 { margin: 0 0 4px; font-size: 14.5px; }
        .job-card p, .delivery-card p, .history-card p { margin: 2px 0; font-size: 13px; color: #555; }
        .job-card .btn-row, .delivery-card .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-claim { background: #ff9900; color: #111; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-decline { background: #fdecea; color: #c0392b; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-pickup { background: #007185; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-deliver { background: #1a7f4b; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .status-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eee; color: #555; }
        .fee-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eafaf1; color: #1a7f4b; }
        .no-data { text-align: center; color: #888; padding: 20px; font-size: 14px; }
        .error-box { background: #fdecea; color: #c0392b; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; word-break: break-word; }
        .fee-type-options { display: flex; flex-direction: column; gap: 8px; }
        .fee-type-option { display: flex; flex-direction: column; gap: 2px; border: 1.5px solid #ddd; border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 12.5px; color: #555; }
        .fee-type-option input { margin-right: 6px; }
        .fee-type-option strong { font-size: 13.5px; color: #232f3e; }
        .fee-type-option.selected { border-color: #232f3e; background: #f5f6f8; }
        .village-chip { background: #eafaf1; color: #1a7f4b; border: 1px solid #b6e3c8; border-radius: 14px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .village-chip:disabled { opacity: .5; cursor: default; }
        .login-prompt { text-align: center; padding: 50px 20px; background: white; border-radius: 8px; }
        .login-prompt a { display: inline-block; margin-top: 12px; background: #ffd814; padding: 10px 22px; border-radius: 5px; text-decoration: none; color: #111; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <span class="header-title">🚚 Delivery Partner Hub</span>
        <div class="header-actions">
            <div id="notifBellMount"></div>
            <button onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <div class="container" id="pageContent">
        <div class="no-data">Loading...</div>
    </div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { showToast } from './toast.js';
    import { escapeHtml } from './sanitize.js';
    import { mountNotificationBell } from './notif-logic.js';
    import { markAsShipped, confirmDelivery } from './order-logic.js';
    import {
        loadDeliveryProfile, saveDeliveryProfile, setDeliveryAvailability,
        loadJobBoard, claimDeliveryJob, loadMyDeliveries, declineDeliveryAssignment,
        useMyLocationForDelivery, refreshDeliveryLocationMap, getCurrentPinLatLng,
        suggestNearbyVillages, getDeliveryStats, loadDeliveryHistory
    } from './delivery-logic.js';

    let currentUser = null;
    let myProfile = null;
    let activeTab = 'jobs'; // 'jobs' | 'deliveries' | 'history' | 'profile'

    window.handleLogout = () => signOut(auth).then(() => window.location.href = 'login.html');
    window.useMyLocationForDelivery = useMyLocationForDelivery;

    onAuthStateChanged(auth, async (user) => {
        const content = document.getElementById('pageContent');
        if (!user) {
            content.innerHTML = `<div class="login-prompt"><p>Please login to become a Delivery Partner.</p><a href="login.html">Login</a></div>`;
            return;
        }

        // No role check here on purpose — any logged-in account (buyer,
        // seller, whoever) can open this page and set up a delivery
        // profile, the same way anyone can open seller-dashboard.html and
        // set up a shop. Setting up a profile below is what actually makes
        // someone a delivery partner; it doesn't require switching their
        // account's primary role first.
        currentUser = user;
        mountNotificationBell(db, user.uid, 'notifBellMount');
        await loadAndRenderProfile();
    });

    async function loadAndRenderProfile() {
        try {
            myProfile = await loadDeliveryProfile(db, currentUser.uid);
        } catch (error) {
            console.error(error);
        }

        if (!myProfile) {
            renderProfileForm();
        } else {
            renderDashboard();
        }
    }

    function renderProfileForm() {
        const content = document.getElementById('pageContent');
        const p = myProfile || {};
        const feeType = p.feeType || 'per_order';
        content.innerHTML = `
            <div class="card">
                <h2>🚚 ${myProfile ? 'Edit your' : 'Set up your'} Delivery Partner profile</h2>
                <p style="font-size:13px; color:#666; margin-top:-6px;">This is shown to sellers when they look for someone to deliver their orders.</p>
                <div class="form-grid">
                    <input type="text" id="dName" placeholder="Your Full Name" value="${escapeHtml(p.name || currentUser.displayName || '')}">
                    <input type="tel" id="dPhone" placeholder="Phone Number" value="${escapeHtml(p.phone || '')}">
                    <input type="text" id="dVillages" placeholder="Villages / areas you serve (comma-separated)" class="full-width" value="${escapeHtml((p.villages || []).join(', '))}">
                    <input type="number" id="dMaxDistance" placeholder="Max distance you'll travel (km, optional)" min="0" value="${p.maxDistanceKm || ''}">
                    <select id="dVehicle" class="full-width">
                        <option value="bike" ${p.vehicleType === 'bike' ? 'selected' : ''}>🏍️ Bike</option>
                        <option value="cycle" ${p.vehicleType === 'cycle' ? 'selected' : ''}>🚲 Cycle</option>
                        <option value="van" ${p.vehicleType === 'van' ? 'selected' : ''}>🚐 Van / Tempo</option>
                        <option value="on_foot" ${p.vehicleType === 'on_foot' ? 'selected' : ''}>🚶 On Foot</option>
                    </select>

                    <div class="full-width">
                        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">📍 Base Location (optional — helps sellers see how far you are)</label>
                        <button type="button" onclick="window.useMyLocationForDelivery()" class="action-btn secondary full-width" style="margin-bottom:8px;">📍 Use My Current Location</button>
                        <div id="deliveryLocationMap" style="height:200px; border-radius:8px; overflow:hidden; margin-bottom:6px;"></div>
                        <p id="deliveryLocationStatus" style="font-size:12px; color:#666; margin:0 0 8px;">Tap the map, or drag the pin, to set it.</p>
                        <button type="button" class="action-btn secondary full-width" onclick="window.suggestVillagesMain()">🔍 Find villages near my pin (within 5 km)</button>
                        <div id="suggestedVillagesBox" style="margin-top:8px;"></div>
                    </div>

                    <div class="full-width">
                        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">💰 How do you charge?</label>
                        <div class="fee-type-options">
                            <label class="fee-type-option ${feeType === 'per_order' ? 'selected' : ''}">
                                <input type="radio" name="dFeeType" value="per_order" ${feeType === 'per_order' ? 'checked' : ''} onchange="window.updateFeeTypeUI()">
                                <strong>Per order</strong><span>A flat ₹ amount for each order you deliver, one at a time.</span>
                            </label>
                            <label class="fee-type-option ${feeType === 'per_trip' ? 'selected' : ''}">
                                <input type="radio" name="dFeeType" value="per_trip" ${feeType === 'per_trip' ? 'checked' : ''} onchange="window.updateFeeTypeUI()">
                                <strong>Per trip</strong><span>A flat ₹ amount for a whole trip, no matter how many orders (even from different shops) you carry together.</span>
                            </label>
                            <label class="fee-type-option ${feeType === 'per_km' ? 'selected' : ''}">
                                <input type="radio" name="dFeeType" value="per_km" ${feeType === 'per_km' ? 'checked' : ''} onchange="window.updateFeeTypeUI()">
                                <strong>Per kilometre</strong><span>A ₹ rate for every km you travel — agreed with the seller/buyer based on the actual distance.</span>
                            </label>
                        </div>
                    </div>
                    <input type="number" id="dFeeAmount" placeholder="Your rate (₹)" min="0" value="${p.feeAmount || ''}" class="full-width">

                    <button class="action-btn full-width" onclick="window.saveProfileMain()">Save Profile & Continue</button>
                    ${myProfile ? `<button class="action-btn secondary full-width" onclick="window.cancelEditMain()">Cancel</button>` : ''}
                </div>
            </div>
        `;
        refreshDeliveryLocationMap();
    }

    window.updateFeeTypeUI = function() {
        document.querySelectorAll('.fee-type-option').forEach(el => {
            el.classList.toggle('selected', el.querySelector('input').checked);
        });
    };

    window.suggestVillagesMain = async function() {
        const box = document.getElementById('suggestedVillagesBox');
        box.innerHTML = `<p style="font-size:12px; color:#888;">Looking for villages near your pin...</p>`;
        const latlng = getCurrentPinLatLng();
        if (!latlng) {
            box.innerHTML = `<p style="font-size:12px; color:#c0392b;">Set your base location on the map above first, then try again.</p>`;
            return;
        }
        const suggestions = await suggestNearbyVillages(db, latlng.lat, latlng.lng, 5);
        if (suggestions.length === 0) {
            box.innerHTML = `<p style="font-size:12px; color:#888;">No known villages found within 5 km of your pin yet — this looks at shops that have already set their location, so it fills in as more shops do. You can still type villages manually above.</p>`;
            return;
        }
        box.innerHTML = `
            <p style="font-size:12px; color:#666; margin-bottom:6px;">Tap to add:</p>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
                ${suggestions.map(s => `<button type="button" class="village-chip" data-village="${escapeHtml(s.name)}" onclick="window.addSuggestedVillage(this)">➕ ${escapeHtml(s.name)} (${s.distanceKm.toFixed(1)} km)</button>`).join('')}
            </div>
        `;
    };

    window.addSuggestedVillage = function(btn) {
        const village = btn.dataset.village;
        const input = document.getElementById('dVillages');
        const current = input.value.split(',').map(v => v.trim()).filter(Boolean);
        if (!current.some(v => v.toLowerCase() === village.toLowerCase())) {
            current.push(village);
            input.value = current.join(', ');
        }
        btn.disabled = true;
        btn.textContent = `✓ ${village} added`;
    };

    window.cancelEditMain = function() { renderDashboard(); };

    window.saveProfileMain = async function() {
        const villages = document.getElementById('dVillages').value.split(',').map(v => v.trim()).filter(Boolean);
        const feeTypeInput = document.querySelector('input[name="dFeeType"]:checked');
        const ok = await saveDeliveryProfile(db, currentUser.uid, {
            name: document.getElementById('dName').value.trim(),
            phone: document.getElementById('dPhone').value.trim(),
            villages,
            vehicleType: document.getElementById('dVehicle').value,
            feeType: feeTypeInput ? feeTypeInput.value : 'per_order',
            feeAmount: document.getElementById('dFeeAmount').value,
            maxDistanceKm: document.getElementById('dMaxDistance').value
        });
        if (ok) await loadAndRenderProfile();
    };

    async function renderDashboard() {
        const content = document.getElementById('pageContent');
        content.innerHTML = `
            <div class="availability-banner ${myProfile.isAvailable ? 'available' : 'busy'}" id="availBanner">
                <span>${myProfile.isAvailable ? '🟢 You are Available for deliveries' : '🔴 You are marked Busy'}</span>
                <button onclick="window.toggleAvailMain()">${myProfile.isAvailable ? 'Go Busy' : 'Go Available'}</button>
            </div>

            <div class="stats-row" id="statsRow">
                <div class="stat-box"><div class="num">—</div><div class="lbl">Delivered Today</div></div>
                <div class="stat-box"><div class="num">—</div><div class="lbl">Active Now</div></div>
                <div class="stat-box"><div class="num">—</div><div class="lbl">Total Delivered</div></div>
            </div>

            <div class="tabs">
                <button class="tab-btn ${activeTab === 'jobs' ? 'active' : ''}" onclick="window.switchTab('jobs')">📋 Job Board</button>
                <button class="tab-btn ${activeTab === 'deliveries' ? 'active' : ''}" onclick="window.switchTab('deliveries')">🚚 Active Deliveries</button>
                <button class="tab-btn ${activeTab === 'history' ? 'active' : ''}" onclick="window.switchTab('history')">📜 History</button>
                <button class="tab-btn ${activeTab === 'profile' ? 'active' : ''}" onclick="window.editProfileMain()">⚙️ Profile</button>
            </div>

            <div class="card" id="tabContentCard" style="display:${activeTab === 'jobs' ? 'block' : 'none'};">
                <h2>📋 Job Board — open deliveries in <strong>${escapeHtml((myProfile.villages || []).join(', ') || 'your area')}</strong></h2>
                <div id="jobBoardContainer"><p>Loading...</p></div>
            </div>
            <div class="card" id="deliveriesCard" style="display:${activeTab === 'deliveries' ? 'block' : 'none'};">
                <h2>🚚 Active Deliveries</h2>
                <div id="myDeliveriesContainer"><p>Loading...</p></div>
            </div>
            <div class="card" id="historyCard" style="display:${activeTab === 'history' ? 'block' : 'none'};">
                <h2>📜 Delivery History</h2>
                <div id="historyContainer"><p>Loading...</p></div>
            </div>
        `;
        loadAndRenderStats();
        loadAndRenderJobBoard();
        loadAndRenderMyDeliveries();
        if (activeTab === 'history') loadAndRenderHistory();
    }

    window.switchTab = function(tab) {
        activeTab = tab;
        document.getElementById('tabContentCard').style.display = tab === 'jobs' ? 'block' : 'none';
        document.getElementById('deliveriesCard').style.display = tab === 'deliveries' ? 'block' : 'none';
        document.getElementById('historyCard').style.display = tab === 'history' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        if (tab === 'history') loadAndRenderHistory();
    };

    async function loadAndRenderStats() {
        const statsRow = document.getElementById('statsRow');
        try {
            const stats = await getDeliveryStats(db, currentUser.uid);
            statsRow.innerHTML = `
                <div class="stat-box"><div class="num">${stats.deliveredToday}</div><div class="lbl">Delivered Today</div></div>
                <div class="stat-box"><div class="num">${stats.active}</div><div class="lbl">Active Now</div></div>
                <div class="stat-box"><div class="num">${stats.deliveredTotal}</div><div class="lbl">Total Delivered</div></div>
            `;
        } catch (error) {
            statsRow.innerHTML = `<div class="error-box full-width" style="grid-column:1/-1;">⚠️ Stats unavailable: ${escapeHtml(error.message || String(error))}</div>`;
        }
    }

    window.toggleAvailMain = async function() {
        await setDeliveryAvailability(db, currentUser.uid, !myProfile.isAvailable);
        myProfile.isAvailable = !myProfile.isAvailable;
        const banner = document.getElementById('availBanner');
        banner.className = `availability-banner ${myProfile.isAvailable ? 'available' : 'busy'}`;
        banner.innerHTML = `
            <span>${myProfile.isAvailable ? '🟢 You are Available for deliveries' : '🔴 You are marked Busy'}</span>
            <button onclick="window.toggleAvailMain()">${myProfile.isAvailable ? 'Go Busy' : 'Go Available'}</button>
        `;
    };

    window.editProfileMain = function() {
        renderProfileForm();
    };

    async function loadAndRenderJobBoard() {
        const container = document.getElementById('jobBoardContainer');
        try {
            const jobs = await loadJobBoard(db, myProfile.villages);
            if (jobs.length === 0) {
                container.innerHTML = `<div class="no-data">No open deliveries in your area right now. Check back later!</div>`;
                return;
            }
            container.innerHTML = jobs.map(j => `
                <div class="job-card">
                    <h4>📦 ${escapeHtml(j.productName || 'Item')} (Qty ${j.quantity || 1})</h4>
                    <p>🏪 From: ${escapeHtml(j.shopName || 'N/A')}</p>
                    <p>📍 To: ${escapeHtml(j.buyerAddress || 'N/A')}</p>
                    <div class="btn-row">
                        <button class="btn-claim" onclick="window.claimJobMain('${j.id}')">✅ Claim this delivery</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<div class="error-box">⚠️ Unable to load the job board: ${escapeHtml(error.message || String(error))}</div>`;
        }
    }

    window.claimJobMain = async function(orderId) {
        const ok = await claimDeliveryJob(db, orderId, {
            uid: currentUser.uid, name: myProfile.name, phone: myProfile.phone,
            feeType: myProfile.feeType, feeAmount: myProfile.feeAmount
        });
        if (ok) { loadAndRenderJobBoard(); loadAndRenderMyDeliveries(); loadAndRenderStats(); }
    };

    function feeLabel(feeType, feeAmount) {
        if (!feeAmount) return '';
        if (feeType === 'per_km') return `₹${feeAmount}/km`;
        if (feeType === 'per_trip') return `₹${feeAmount}/trip`;
        return `₹${feeAmount}/order`;
    }

    async function loadAndRenderMyDeliveries() {
        const container = document.getElementById('myDeliveriesContainer');
        try {
            const deliveries = await loadMyDeliveries(db, currentUser.uid);
            if (deliveries.length === 0) {
                container.innerHTML = `<div class="no-data">No active deliveries assigned to you right now.</div>`;
                return;
            }
            container.innerHTML = deliveries.map(o => {
                const statusTag = `<span class="status-tag">${escapeHtml(o.status)}</span>`;
                const fee = feeLabel(o.deliveryFeeType, o.deliveryFeeAmount);
                let actionBtns = '';
                if (o.status === 'Accepted') {
                    actionBtns = `
                        <button class="btn-pickup" onclick="window.pickupMain('${o.id}')">📦 Mark Picked Up</button>
                        <button class="btn-decline" onclick="window.declineMain('${o.id}')">✖ Decline</button>
                    `;
                } else if (o.status === 'Shipped') {
                    actionBtns = `<button class="btn-deliver" onclick="window.deliverMain('${o.id}')">✅ Confirm Delivery (OTP)</button>`;
                }
                return `
                    <div class="delivery-card">
                        <h4>📦 ${escapeHtml(o.productName || 'Item')} (Qty ${o.quantity || 1}) ${statusTag} ${fee ? `<span class="fee-tag">${fee}</span>` : ''}</h4>
                        <p>🏪 From: ${escapeHtml(o.shopName || 'N/A')}</p>
                        <p>📍 To: ${escapeHtml(o.buyerAddress || 'N/A')}</p>
                        <p>📞 Buyer: ${escapeHtml(o.buyerPhone || 'N/A')}</p>
                        <div class="btn-row">${actionBtns}</div>
                    </div>
                `;
            }).join('');
        } catch (error) {
            container.innerHTML = `<div class="error-box">⚠️ Unable to load your deliveries: ${escapeHtml(error.message || String(error))}</div>`;
        }
    }

    async function loadAndRenderHistory() {
        const container = document.getElementById('historyContainer');
        container.innerHTML = `<p>Loading...</p>`;
        try {
            const history = await loadDeliveryHistory(db, currentUser.uid);
            if (history.length === 0) {
                container.innerHTML = `<div class="no-data">No completed deliveries yet.</div>`;
                return;
            }
            // Only "per order" fees are safely summable — each one is a
            // separate, unambiguous charge. "Per trip" fees are deliberately
            // NOT auto-totalled here: if several orders (possibly from
            // different shops) were bundled into the same trip, each of
            // those orders carries a COPY of that trip's fee, and summing
            // them would count the same trip's earnings multiple times.
            const perOrderEarned = history.reduce((sum, o) => sum + (o.deliveryFeeType === 'per_order' ? (o.deliveryFeeAmount || 0) : 0), 0);
            const hasTripOrKm = history.some(o => o.deliveryFeeType === 'per_trip' || o.deliveryFeeType === 'per_km');
            container.innerHTML = `
                <p style="font-size:13px; color:#666; margin-bottom:10px;"><strong>${history.length}</strong> completed deliveries shown${perOrderEarned > 0 ? ` · Per-order earnings: <strong>₹${perOrderEarned}</strong>` : ''}${hasTripOrKm ? ' (per-trip and per-km deliveries aren\'t totalled automatically — see each entry below)' : ''}</p>
                ${history.map(o => {
                    const deliveredDate = o.deliveredAt && o.deliveredAt.toDate ? o.deliveredAt.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                    const fee = feeLabel(o.deliveryFeeType, o.deliveryFeeAmount);
                    return `
                        <div class="history-card">
                            <h4>📦 ${escapeHtml(o.productName || 'Item')} ${fee ? `<span class="fee-tag">${fee}</span>` : ''}</h4>
                            <p>🏪 ${escapeHtml(o.shopName || 'N/A')} → ${escapeHtml(o.buyerAddress || 'N/A')}</p>
                            <p style="color:#999;">Delivered ${deliveredDate}</p>
                        </div>
                    `;
                }).join('')}
            `;
        } catch (error) {
            container.innerHTML = `<div class="error-box">⚠️ Unable to load delivery history: ${escapeHtml(error.message || String(error))}</div>`;
        }
    }

    window.declineMain = async function(orderId) {
        if (!confirm("Back out of this delivery? It'll go back on the job board for someone else.")) return;
        await declineDeliveryAssignment(db, orderId);
        loadAndRenderMyDeliveries();
        loadAndRenderJobBoard();
        loadAndRenderStats();
    };

    window.pickupMain = async function(orderId) {
        await markAsShipped(db, orderId);
        loadAndRenderMyDeliveries();
    };

    window.deliverMain = async function(orderId) {
        await confirmDelivery(db, orderId);
        loadAndRenderMyDeliveries();
        loadAndRenderStats();
    };
</script>
</body>
</html>
