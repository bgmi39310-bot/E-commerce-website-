<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 998; }
        .back-arrow { font-size: 22px; cursor: pointer; margin-right: 15px; }
        .header-title { flex-grow: 1; font-size: 18px; font-weight: bold; }
        
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .cart-item { background: white; padding: 15px; border-radius: 8px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 5px; }
        .item-details { flex-grow: 1; }
        .total-box { background: white; padding: 20px; border-radius: 8px; text-align: right; font-size: 18px; font-weight: bold; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-checkout { background-color: #ffd814; border: 1px solid #fcd200; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 16px; margin-top: 15px; width: 100%; }
        .remove-btn { color: #ff4d4d; cursor: pointer; font-size: 13px; font-weight: bold; border: none; background: none; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="back-arrow" onclick="history.back()">⬅️</div>
        <div class="header-title">Shopping Cart</div>
    </header>

    <div class="container">
        <h2>Your Cart Items</h2>
        <div id="cartList"></div>
        <div id="cartSummary" style="display:none;">
            <div class="total-box">
                Total Amount: <span id="grandTotal" style="color: #b12704;">₹0</span>
                <br>
                <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartList = document.getElementById('cartList');
            const summary = document.getElementById('cartSummary');
            cartList.innerHTML = '';

            if (cart.length === 0) {
                cartList.innerHTML = '<p style="text-align:center; color:#666;">Your cart is empty!</p>';
                summary.style.display = 'none';
                return;
            }

            summary.style.display = 'block';
            let total = 0;

            cart.forEach((item, index) => {
                // यहाँ हमने 'qty' और 'quantity' दोनों को हैंडल कर लिया है ताकि कभी गलती न हो
                let itemQty = parseInt(item.qty || item.quantity) || 1;
                let itemPrice = parseFloat(item.price) || 0;
                let itemTotal = itemPrice * itemQty;
                total += itemTotal;

                cartList.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100'}" alt="Item" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
                        <div class="item-details">
                            <h4 style="margin:0 0 5px 0;">${item.name || 'Product'}</h4>
                            <div style="color:#b12704; font-weight:bold;">₹${itemPrice.toFixed(2)} × ${itemQty} = ₹${itemTotal.toFixed(2)}</div>
                            <small style="color:#555;">🏪 ${item.shopName || 'Local Shop'}</small><br>
                            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('grandTotal').innerText = "₹" + total.toFixed(2);
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function checkout() {
            alert("Order placed successfully! Thank you for shopping with DesiMarket.");
            localStorage.removeItem('cart');
            window.location.href = "index.html";
        }

        window.onload = loadCart;
    </script>
</body>
</html>
