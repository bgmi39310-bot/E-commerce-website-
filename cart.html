<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - DesiMarket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        /* Header & Menu Icon Styling */
        header { background-color: #232f3e; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
        .menu-icon span { width: 25px; height: 3px; background-color: white; border-radius: 2px; }

        /* Side Menu Drawer */
        .side-menu { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; right: 0; background-color: #232f3e; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: -2px 0 5px rgba(0,0,0,0.5); }
        .side-menu a { padding: 12px 25px; text-decoration: none; font-size: 18px; color: white; display: block; transition: 0.2s; }
        .side-menu a:hover { background-color: #37475a; }
        .side-menu .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; margin-left: 50px; }

        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #232f3e; margin-top: 0; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item-info { font-size: 16px; font-weight: bold; color: #333; }
        .item-price { color: #b12704; font-size: 16px; font-weight: bold; }
        .btn-remove { background-color: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-remove:hover { background-color: #e04343; }

        .cart-summary { margin-top: 20px; text-align: right; }
        .total-amount { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .btn-checkout { background-color: #ffd814; border: 1px solid #fcd200; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; font-size: 16px; }
        .btn-checkout:hover { background-color: #f7ca00; }
        .empty-cart { text-align: center; color: #775; padding: 30px; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <h2>DesiMarket</h2>
        <!-- 3-Lines (Hamburger) Icon -->
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Side Slide Menu -->
    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Home</a>
        <a href="seller-dashboard.html">🛒 Seller Hub</a>
        <a href="cart.html">🛍️ Cart</a>
        <a href="orders.html">📦 Orders</a>
        <a href="account.html">👤 Account</a>
    </div>

    <div class="container">
        <h2>Your Shopping Cart</h2>
        <div id="cartItemsContainer">
            <!-- Cart items will load here -->
        </div>
        
        <div class="cart-summary" id="cartSummary" style="display: none;">
            <div class="total-amount" id="totalAmount">Total: ₹0</div>
            <button class="btn-checkout" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            if (menu.style.width === '250px') {
                menu.style.width = '0';
            } else {
                menu.style.width = '250px';
            }
        }

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cartItemsContainer');
            const summary = document.getElementById('cartSummary');
            
            container.innerHTML = '';
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart">Your cart is empty! Add some products from home.</div>';
                summary.style.display = 'none';
                return;
            }
            
            let total = 0;
            cart.forEach((item, index) => {
                total += Number(item.price);
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="item-info">${item.name}</div>
                        <div class="item-price">₹${item.price}</div>
                        <button class="btn-remove" onclick="removeItem(${index})">Remove</button>
                    </div>
                `;
            });
            
            document.getElementById('totalAmount').innerText = "Total: ₹" + total;
            summary.style.display = 'block';
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function proceedToCheckout() {
            alert("Order placed successfully! Thank you for shopping with DesiMarket.");
            localStorage.removeItem('cart');
            window.location.href = 'orders.html';
        }

        window.onload = loadCart;
    </script>
</body>
</html>
