<!DOCTYPE html>
<html lang="en">
<head>
    <script src="page-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subscriptions - DesiMarket</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#232f3e">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="shared-ui.css">
    <script src="pwa-init.js" defer></script>
    <script src="click-guard.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; margin: 0; color: #0f1111; }
        header { background: #232f3e; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        header a { color: #fff; text-decoration: none; font-size: 22px; }
        header h1 { font-size: 18px; margin: 0; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 14px; }
        .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.1); border-left: 5px solid #ff9900; }
        .card.paused { border-left-color: #999; opacity: .85; }
        .title { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
        .shop { font-size: 12.5px; color: #666; margin-bottom: 8px; }
        .row { font-size: 13.5px; margin: 3px 0; color: #333; }
        .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; margin-left: 6px; }
        .tag.active { background: #eafaf1; color: #1a7f4b; }
        .tag.paused { background: #eee; color: #555; }
        .btns { display: flex; gap: 8px; margin-top: 10px; }
        .btns button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; border: 1.5px solid #232f3e; background: #fff; color: #232f3e; }
        .btns .danger { border-color: #c0392b; color: #c0392b; }
        .note { font-size: 12px; color: #777; margin-top: 6px; }
        .empty { text-align: center; padding: 50px 20px; color: #666; background: #fff; border-radius: 12px; }
        .empty a { color: #007185; font-weight: 700; }
    </style>
</head>
<body>
    <header><a href="index.html">←</a><h1>🔁 My Subscriptions</h1></header>
    <div class="wrap" id="list"><div class="empty">Load ho raha hai...</div></div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { BACKEND_BASE_URL } from './order-api.js';
        import { showToast } from './toast.js';
        import { escapeHtml } from './sanitize.js';

        const FREQ = { daily: 'Roz', alternate: 'Ek din chhod kar', weekly: 'Hafte me ek baar' };
        let currentUser = null;

        async function api(path, method = 'GET') {
            const idToken = await currentUser.getIdToken();
            const res = await fetch(`${BACKEND_BASE_URL}/api/subscriptions${path}`, {
                method, headers: { 'Authorization': `Bearer ${idToken}` }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Something went wrong.');
            return data;
        }

        async function load() {
            const el = document.getElementById('list');
            try {
                const { subscriptions } = await api('');
                if (!subscriptions.length) {
                    el.innerHTML = `<div class="empty">Abhi koi subscription nahi hai.<br><br>Doodh, sabzi ya akhbaar jaisi cheez ke product page par <strong>"🔁 Roz ke liye lagao"</strong> dabaiye.<br><br><a href="index.html">Products dekhiye →</a></div>`;
                    return;
                }
                el.innerHTML = subscriptions.map(s => `
                    <div class="card ${s.status === 'paused' ? 'paused' : ''}">
                        <p class="title">${escapeHtml(s.productName || 'Product')} × ${s.quantity}
                            <span class="tag ${s.status}">${s.status === 'active' ? '● Chalu' : '⏸ Ruka hua'}</span></p>
                        <div class="shop">🏪 ${escapeHtml(s.shopName || 'Local Shop')}</div>
                        <div class="row">🔁 ${FREQ[s.frequency] || s.frequency}${s.slot ? ' · 🕐 ' + escapeHtml(s.slot) : ''}</div>
                        <div class="row">💵 ${s.paymentMethod === 'UPI' ? 'UPI se, delivery par' : 'Cash on Delivery'}</div>
                        ${s.status === 'active' ? `<div class="row">📅 Agla order: <strong>${escapeHtml(s.nextRunDate || '')}</strong> subah</div>` : ''}
                        <div class="row">📦 Ab tak ${s.ordersPlaced || 0} order ban chuke hain</div>
                        ${s.lastResult ? `<div class="note">Pichhla: ${escapeHtml(s.lastResult)}</div>` : ''}
                        <div class="btns">
                            <button onclick="changeSub('${s.id}', '${s.status === 'active' ? 'pause' : 'resume'}')">${s.status === 'active' ? '⏸ Pause' : '▶️ Dobara chalu'}</button>
                            <button class="danger" onclick="changeSub('${s.id}', 'cancel')">✕ Band karo</button>
                        </div>
                    </div>`).join('');
            } catch (e) {
                el.innerHTML = `<div class="empty">Subscriptions load nahi ho paye.<br>${escapeHtml(e.message)}</div>`;
            }
        }

        window.changeSub = async function(id, action) {
            if (action === 'cancel' && !confirm('Ye subscription hamesha ke liye band ho jayega. Pakka?')) return;
            try {
                await api(`/${id}/${action}`, 'POST');
                showToast(action === 'pause' ? 'Pause ho gaya ⏸' : action === 'resume' ? 'Dobara chalu ✅' : 'Band ho gaya');
                load();
            } catch (e) {
                showToast(e.message, 'error');
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (!user || user.isAnonymous) { window.location.href = 'login.html'; return; }
            currentUser = user;
            load();
        });
    </script>
</body>
</html>
